<script>
/* SummaryView.html — 주간 요약 화면 (웹앱 홈과 스냅샷 HTML 이 같은 코드를 쓴다)
 * 구성: 상단 요약 3장(이상 징후 / 동향보고 / 조치사항) → 4분면 → 탭 3개 상세 → 조치 안내(1줄 + 조항)
 * opts.web = true 이면 관리 건·중도매인 링크가 웹앱 경로, false 이면 문서 내 앵커 */
(function (global) {
  'use strict';
  function h(v) { return v === null || v === undefined ? '' : String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return n === null || n === undefined || n === '' ? '—' : Number(n).toLocaleString('ko-KR') + '원'; }
  function man(n) { return n === null || n === undefined || n === '' ? '—' : Math.round(Number(n) / 10000).toLocaleString('ko-KR') + '만원'; }
  function pct(g) { if (!g) return '—'; if (g.status !== '정상') return '<span class="muted">' + h(g.status) + '</span>'; return (g.value > 0 ? '+' : '') + (g.value * 100).toFixed(1) + '%'; }
  function badge(t) { var cls = { '정상': 'b-ok', '판정보류': 'b-bad', '지연': 'b-warn', '휴업': 'b-warn', '폐업': 'b-bad', '위험': 'b-bad', '경고': 'b-bad', '주의': 'b-warn', '정보': 'b-info', '동향확인중': 'b-warn', '접수': 'b-info', '조치진행': 'b-warn', '승인대기': 'b-warn', '확인완료': 'b-info', '재점검대기': 'b-info', '종결': 'b-ok', '확인 필요': 'b-warn', '충돌': 'b-bad', '보류': 'b-bad', '승인': 'b-ok', '반려': 'b-bad', '완료': 'b-ok', '진행': 'b-warn', '도래': 'b-warn' }[t] || 'b-info'; return '<span class="badge ' + cls + '">' + h(t) + '</span>'; }
  function table(cols, rows, empty) {
    if (!rows.length) return '<p class="muted">' + h(empty || '해당 없음') + '</p>';
    return '<div class="scroll"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + h(c.t) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="' + (c.num ? 'num' : '') + (c.wrap ? ' wrap' : '') + '">' + (c.f ? c.f(r) : h(r[c.k])) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function ev(s) { var e = s.evidence || {}; switch (s.rule_id) {
    case 'S01': return '회전율 ' + e.prevTurnover + '→' + e.turnover + '회(' + e.dropPct + '%↓), 회수 ' + e.collectionDays + '일';
    case 'S02': return '미수 ' + man(e.balance) + ' (3개월 평균의 ' + e.ratio + '배)';
    case 'S03': return '연체 ' + man(e.overdueAmount) + ' · ' + e.overdueDays + '일 (' + e.stage + ')';
    case 'S04': return '실적 전년 동월 ' + e.yoyPct + '%, 3개월 ' + e.ma3Pct + '%';
    case 'S05': return '한도 사용률 ' + e.usagePct + '%';
    case 'S06': return e.kind + ' 만기 ' + e.date + ' (D-' + e.dday + ')';
    case 'S07': return '동시 ' + (e.rules || []).join('+');
    default: return ''; } }

  function matrixSvg(mx, link) {
    var pts = mx.points || [];
    if (!pts.length) return '<p class="muted">분류할 점이 없습니다' + (mx.excluded && mx.excluded.length ? ' (제외 ' + mx.excluded.length + '명: ' + h(mx.excluded[0].reason) + ' 등)' : '') + '.</p>';
    var W = 760, H = 420, L = 56, R = 16, T = 16, B = 40, growthMode = mx.xMode === '전년동월증감';
    var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
    var x0, x1, X;
    if (growthMode) { var m = Math.max(30, Math.ceil(Math.max.apply(null, xs.map(Math.abs)) / 10) * 10); x0 = -m; x1 = m; X = function (v) { return L + (v - x0) / (x1 - x0) * (W - L - R); }; }
    else { var lx0 = Math.log10(Math.max(1, Math.min.apply(null, xs))) - 0.1, lx1 = Math.log10(Math.max.apply(null, xs)) + 0.1; X = function (v) { return L + (Math.log10(Math.max(v, 1)) - lx0) / (lx1 - lx0) * (W - L - R); }; }
    var y1 = Math.max.apply(null, ys.concat([mx.boundaries.y || 0])) * 1.15 || 1, Y = function (v) { return T + (1 - v / y1) * (H - T - B); };
    var smax = Math.max.apply(null, pts.map(function (p) { return p.size || 0; }).concat([1]));
    var bx = X(mx.boundaries.x), by = Y(mx.boundaries.y);
    var col = { HH: '#1baf7a', HL: '#e34948', LH: '#2a78d6', LL: '#eda100' };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="거래·회수 4분면">';
    svg += '<line x1="' + bx + '" x2="' + bx + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--text-2)" stroke-dasharray="4 4"/><line x1="' + L + '" x2="' + (W - R) + '" y1="' + by + '" y2="' + by + '" stroke="var(--text-2)" stroke-dasharray="4 4"/>';
    var lab = function (x, y, t, a) { return '<text class="axis" x="' + x + '" y="' + y + '" text-anchor="' + a + '" font-weight="600">' + h(t) + '</text>'; };
    svg += lab(W - R - 4, T + 14, mx.quadrants.HH.label + ' ' + mx.counts.HH, 'end') + lab(W - R - 4, H - B - 6, mx.quadrants.HL.label + ' ' + mx.counts.HL, 'end') + lab(L + 4, T + 14, mx.quadrants.LH.label + ' ' + mx.counts.LH, 'start') + lab(L + 4, H - B - 6, mx.quadrants.LL.label + ' ' + mx.counts.LL, 'start');
    if (growthMode) for (var v = x0; v <= x1; v += (x1 - x0) / 6) svg += '<text class="axis" x="' + X(v) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + (v > 0 ? '+' : '') + Math.round(v) + '%</text>';
    for (var k = 0; k <= 4; k++) { var yv = y1 * k / 4; svg += '<g class="grid"><line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(yv) + '" y2="' + Y(yv) + '"/></g><text class="axis" x="' + (L - 6) + '" y="' + (Y(yv) + 4) + '" text-anchor="end">' + yv.toFixed(1) + '회</text>'; }
    svg += '<text class="axis" x="' + ((L + W - R) / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + h(mx.axes.x) + ' · 경계 ' + h(mx.boundaries.xSource) + '</text>';
    svg += '<text class="axis" transform="translate(12,' + (H / 2) + ') rotate(-90)" text-anchor="middle">' + h(mx.axes.y) + ' · 경계 ' + (mx.boundaries.y === null ? '—' : mx.boundaries.y.toFixed(2)) + '회</text>';
    var smaxAll = Math.max.apply(null, pts.map(function (p) { return Math.max(p.size || 0, p.prev && p.prev.size || 0); }).concat([1]));
    var inRange = function (v) { return growthMode ? Math.max(x0, Math.min(x1, v)) : v; };
    pts.forEach(function (p) {
      var r = 5 + 13 * Math.sqrt((p.size || 0) / smaxAll), cx = X(p.x), cy = Y(p.y);
      var prevSvg = '';
      if (p.prev && p.prev.available) {
        var pr = 5 + 13 * Math.sqrt((p.prev.size || 0) / smaxAll), px = X(inRange(p.prev.x)), py = Y(Math.min(p.prev.y, y1));
        prevSvg = '<g class="prev" data-prev="' + h(p.wholesaler_id) + '" style="display:none"><line x1="' + px + '" y1="' + py + '" x2="' + cx + '" y2="' + cy + '" stroke="' + col[p.quadrant] + '" stroke-dasharray="3 3"/><circle cx="' + px + '" cy="' + py + '" r="' + pr + '" fill="none" stroke="' + col[p.quadrant] + '" stroke-width="2" stroke-dasharray="5 4"/><text class="axis" x="' + (px + pr + 2) + '" y="' + (py - 4) + '">' + h(p.prev.ym) + ' (전년)</text></g>';
      }
      svg += prevSvg + '<g class="pt" data-ws="' + h(p.wholesaler_id) + '" style="cursor:pointer"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + col[p.quadrant] + '" fill-opacity="0.75" stroke="var(--surface)" stroke-width="2"><title>' + h(p.wholesaler_id + ' ' + p.name + ' · ' + p.quadrantLabel) + '\n' + (growthMode ? '전년 동월 대비 ' + p.x.toFixed(1) + '% · 당월 ' + won(p.lastMonth) + (p.prevYearMonth !== null ? ' / 전년 동월 ' + won(p.prevYearMonth) : '') : '12개월 구매 ' + won(p.x)) + '\n회전율 ' + p.y.toFixed(2) + '회 · 미수금 ' + won(p.balance) + (p.prev && p.prev.available ? '\n클릭: 전년 동월 위치(점선) 보기' : (p.prev ? '\n전년 위치 없음: ' + p.prev.reason : '')) + '</title></circle>' +
        '<text class="axis" x="' + (cx + r + 2) + '" y="' + (cy + 3) + '">' + h(p.wholesaler_id) + '</text></g>';
    });
    svg += '</svg>';
    return '<div class="legend"><span><i style="background:#1baf7a"></i>' + h(mx.quadrants.HH.desc) + '</span><span><i style="background:#e34948"></i>' + h(mx.quadrants.HL.desc) + '</span><span><i style="background:#2a78d6"></i>' + h(mx.quadrants.LH.desc) + '</span><span><i style="background:#eda100"></i>' + h(mx.quadrants.LL.desc) + '</span><span>크기: ' + h(mx.axes.size) + '</span><span>원 클릭 = 전년 동월 위치(점선)</span></div>' + svg +
      '<details><summary>분류 표 (' + pts.length + '명, 제외 ' + (mx.excluded || []).length + '명)</summary>' + table([{ t: '중도매인', f: function (p) { return link.ws(p.wholesaler_id, p.name); } }, { t: '분류', f: function (p) { return '<span class="badge" style="background:' + col[p.quadrant] + '22;color:' + col[p.quadrant] + '">' + h(p.quadrantLabel) + '</span>'; } },
        { t: growthMode ? '전년 동월 대비' : '12개월 구매', num: true, f: function (p) { return growthMode ? (p.x > 0 ? '+' : '') + p.x.toFixed(1) + '%' : won(p.x); } }, { t: '당월 실적', num: true, f: function (p) { return won(p.lastMonth); } }, { t: '회전율', num: true, f: function (p) { return p.y.toFixed(2); } }, { t: '미수금', num: true, f: function (p) { return won(p.balance); } }], pts.slice().sort(function (a, b) { return a.quadrant.localeCompare(b.quadrant) || b.y - a.y; })) +
      (mx.excluded && mx.excluded.length ? table([{ t: '제외', f: function (p) { return link.ws(p.wholesaler_id, p.name); } }, { t: '사유', k: 'reason' }], mx.excluded) : '') + '</details>';
  }

  /**
   * @param root DOM 요소
   * @param d weeklySummary_ 결과
   * @param opts { web: bool, onChecklist(caseId), onCase(caseId) }
   */
  function renderSummary(root, d, opts) {
    opts = opts || {};
    var link = {
      ws: function (id, name) { return opts.web ? '<a href="#/ws/' + encodeURIComponent(id) + '">' + h(id + ' ' + (name || '')) + '</a>' : '<a href="#ws-' + h(id) + '">' + h(id + ' ' + (name || '')) + '</a>'; },
      cs: function (id) { return id ? (opts.web ? '<a href="#/case/' + encodeURIComponent(id) + '">' + h(id) + '</a>' : '<a href="#case-' + h(id) + '">' + h(id) + '</a>') : '<span class="muted">—</span>'; }
    };
    var k = d.kpis, st = d.status, flaggedHigh = k.flaggedHigh;
    var html = '';
    if (st.data_status && st.data_status !== '정상') html += '<div class="note bad">데이터 상태 <b>' + h(st.data_status) + '</b> — ' + h(st.status_reasons || '') + ' 이 기간 수치는 판정 보류입니다.</div>';
    if (st.ar_available === '아니오') html += '<div class="note warn">미수잔액·입금 자료가 아직 없어 회전율·연체·미수금 증가 징후는 산출되지 않습니다. 실적 감소·담보 기한 징후만 표시됩니다.</div>';
    // 체계 띠: 채권관리 → 동향관리 → 연체채권 조치
    html += '<div class="flowband"><span class="step">① 채권관리<small>이상 징후 자동 탐지</small></span><span class="arr">→</span><span class="step">② 동향관리<small>현장 확인 체크리스트</small></span><span class="arr">→</span><span class="step">③ 연체채권 조치<small>매뉴얼 조항에 따른 대응</small></span><span class="goal">목적: 중도매인 실적 관리로 분산 역량 강화</span></div>';
    // 요약 3장
    html += '<div class="sum3">' +
      '<a class="sumcard ' + (flaggedHigh ? 'bad' : (k.flagged ? 'warn' : 'ok')) + '" href="#tab-signal" data-tab="signal"><div class="k">① 채권관리 — 이상 징후</div><div class="v">' + k.flagged + '<small>명</small></div><div class="s">경고 이상 ' + flaggedHigh + '명 · 확인 대기 ' + k.trendWait + '건' + (k.trendLate ? ' · <b>지연 ' + k.trendLate + '</b>' : '') + '</div></a>' +
      '<a class="sumcard ' + (k.trendLate ? 'bad' : (k.trendWait ? 'warn' : 'ok')) + '" href="#tab-trend" data-tab="trend"><div class="k">② 동향관리 — 현장 확인</div><div class="v">' + k.trendsThisWeek + '<small>건/주</small></div><div class="s">체크리스트 대기 ' + k.trendWait + '건 · 최근 제출 ' + d.recentTrends.length + '건</div></a>' +
      '<a class="sumcard ' + (k.pendingApproval ? 'warn' : (k.openActions ? 'info' : 'ok')) + '" href="#tab-action" data-tab="action"><div class="k">③ 연체채권 조치</div><div class="v">' + k.openActions + '<small>건 진행</small></div><div class="s">승인 대기 ' + k.pendingApproval + ' · 재점검 ' + k.recheck + (k.recheckDue ? ' (도래 ' + k.recheckDue + ')' : '') + '</div></a></div>';
    // 4분면
    html += '<div class="card"><h2>거래·회수 4분면 <span class="muted" style="font-size:12px;font-weight:400">세로 미수금 회전율 · 가로 ' + h(d.matrix.axes.x) + '</span></h2>' + matrixSvg(d.matrix, link) + '<div class="note">' + h(d.matrix.disclaimer) + '</div></div>';
    // 탭
    html += '<div class="tabs" id="sumTabs"><button data-tab="signal" class="on">① 이상 징후 (' + k.flagged + ')</button><button data-tab="trend">② 현장 확인 (' + (k.trendWait + d.recentTrends.length) + ')</button><button data-tab="action">③ 조치 (' + (k.openActions + k.recheck) + ')</button><button data-tab="guide">조치 안내·매뉴얼 근거</button></div>';
    // ① 징후
    html += '<section id="tab-signal" class="tabpane"><div class="card">' + table([
      { t: '등급', f: function (r) { return badge(r.severity); } }, { t: '중도매인', f: function (r) { return link.ws(r.wholesaler_id, r.name) + (r.assignee ? '<br><span class="muted">' + h(r.assignee) + '</span>' : ''); } },
      { t: '징후', wrap: true, f: function (r) { return r.signals.map(function (s) { return '<div><b>' + h(s.rule_id) + '</b> ' + h(s.label) + ' <span class="muted">' + h(ev(s)) + '</span></div>'; }).join(''); } },
      { t: '당월 실적(전년 동월 대비)', num: true, f: function (r) { return r.lastMonth ? won(r.lastMonth.amount) + '<br>' + pct(r.yoy) : '—'; } }, { t: '미수금 / 연체', num: true, f: function (r) { return man(r.balance) + '<br>' + (r.overdue ? '<span class="badge b-bad">' + man(r.overdue) + ' ' + r.overdueDays + '일</span>' : '—'); } },
      { t: '현장 확인 / 관리 건', f: function (r) { return (r.latest_trend ? h(r.latest_trend.checked_date) + ' ' + h(r.latest_trend.result_class) : (r.trend_due ? '확인 기한 ' + h(r.trend_due) : '<span class="muted">—</span>')) + '<br>' + link.cs(r.case_id) + (r.case_status ? ' ' + badge(r.case_status) : ''); } },
      { t: '조치 안내', wrap: true, f: function (r) { return (r.guides || []).map(function (g) { return g.first ? '<div><b>' + h(g.first.action) + '</b><br><span class="muted">' + h(g.first.basis) + '</span></div>' : '<div class="muted">' + h(g.label) + ': 확인 필요(조항 미등록)</div>'; }).join('') || '<span class="muted">해당 상황 없음</span>'; } }
    ], d.flagged, '현재 이상 징후 없음') + '</div></section>';
    // ② 동향
    html += '<section id="tab-trend" class="tabpane hidden"><div class="card"><h2>현장 확인 대기 (체크리스트)</h2>' + table([
      { t: '관리 건', f: function (r) { return link.cs(r.case_id); } }, { t: '중도매인', f: function (r) { return link.ws(r.wholesaler_id, r.name); } }, { t: '담당 경매사', k: 'auctioneer' }, { t: '징후', f: function (r) { return r.signals.join(', '); } },
      { t: '확인 기한', f: function (r) { return h(r.trend_due) + (r.overdue ? ' ' + badge('지연') : ''); } }, { t: '', f: function (r) { return '<button data-ck="' + h(r.case_id) + '">체크리스트' + (opts.web ? ' 입력·인쇄' : ' 인쇄') + '</button>'; } }
    ], d.trendWait, '확인 대기 없음') + '<h2 style="margin-top:14px">최근 제출된 동향보고</h2>' + table([
      { t: '제출', f: function (t) { return h((t.submitted_at || '').substring(0, 10)); } }, { t: '중도매인', f: function (t) { return link.ws(t.wholesaler_id, t.name); } }, { t: '관리 건', f: function (t) { return link.cs(t.case_id); } }, { t: '확인', f: function (t) { return h(t.checked_date + ' ' + t.check_method); } },
      { t: '확인된 사실', wrap: true, f: function (t) { return (t.facts || []).slice(0, 3).map(h).join('<br>') + (t.facts && t.facts.length > 3 ? '<br><span class="muted">외 ' + (t.facts.length - 3) + '</span>' : ''); } }, { t: '결과', f: function (t) { return h(t.result_class); } }, { t: '작성', k: 'writer' }
    ], d.recentTrends, '제출된 보고 없음') + '</div></section>';
    // ③ 조치
    html += '<section id="tab-action" class="tabpane hidden"><div class="card"><h2>진행 중 조치</h2>' + table([
      { t: '관리 건', f: function (a) { return link.cs(a.case_id); } }, { t: '중도매인', f: function (a) { return link.ws(a.wholesaler_id, a.name); } }, { t: '조치', k: 'action_type' }, { t: '내용', k: 'content', wrap: true }, { t: '담당', k: 'owner' }, { t: '기한', k: 'due_date' }, { t: '승인', f: function (a) { return badge(a.approval_status); } }
    ], d.openActions, '진행 중 조치 없음') + '<h2 style="margin-top:14px">재점검 예정</h2>' + table([
      { t: '관리 건', f: function (r) { return link.cs(r.case_id); } }, { t: '중도매인', f: function (r) { return link.ws(r.wholesaler_id, r.name); } }, { t: '종결 사유', k: 'close_reason' }, { t: '재점검일', f: function (r) { return h(r.recheck_date) + (r.due ? ' ' + badge('도래') : ''); } }
    ], d.recheck, '없음') + '<h2 style="margin-top:14px">최근 완료</h2>' + table([
      { t: '완료', k: 'done_date' }, { t: '관리 건', f: function (a) { return link.cs(a.case_id); } }, { t: '중도매인', f: function (a) { return link.ws(a.wholesaler_id, a.name); } }, { t: '조치', k: 'action_type' }, { t: '결과', k: 'result', wrap: true }
    ], d.doneActions, '없음') + '</div></section>';
    // 조치 안내
