<script>
/* Client.html — 화면 로직. 권한 판단은 서버가 한다(여기서 메뉴를 숨기는 것은 편의 기능). */
'use strict';
var S = { boot: null, cat: '전체' };

/* ───── 공통 ───── */
function token() { try { return localStorage.getItem('wm_token') || ''; } catch (e) { return ''; } }
function setToken(t) { try { t ? localStorage.setItem('wm_token', t) : localStorage.removeItem('wm_token'); } catch (e) { /* 저장 불가 환경 */ } }
function rawCall(fn, args) {
  return new Promise(function (resolve, reject) {
    var r = google.script.run
      .withSuccessHandler(function (res) { res && res.ok ? resolve(res.data) : reject(new Error(res ? res.error : '응답 없음')); })
      .withFailureHandler(function (e) { reject(e); });
    r[fn].apply(r, args);
  });
}
/* 접속코드 방식이면 토큰을 붙여 api_call 로 보내고, 세션 만료면 로그인 화면으로 */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var p = S.codeMode ? rawCall('api_call', [token(), fn, args]) : rawCall(fn, args);
  return p.catch(function (e) { if (/SESSION_EXPIRED/.test(e.message)) { setToken(''); showLogin('세션이 만료되었습니다. 다시 로그인하세요.'); } throw e; });
}
function h(v) {
  return v === null || v === undefined ? '' : String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function won(n) { return n === null || n === undefined || n === '' ? '—' : Number(n).toLocaleString('ko-KR') + '원'; }
function num(n) { return n === null || n === undefined || n === '' ? '—' : Number(n).toLocaleString('ko-KR'); }
function pct(g) {
  if (!g) return '—';
  if (g.status !== '정상') return '<span class="muted" title="' + h(g.reason) + '">비교불가</span>';
  var v = (g.value * 100).toFixed(1);
  return (g.value > 0 ? '+' : '') + v + '%';
}
function can(a) { return S.boot && S.boot.perms.indexOf(a) >= 0; }
function badge(text) {
  var cls = { '정상': 'b-ok', '완료': 'b-ok', '일치': 'b-ok', '승인': 'b-ok',
    '판정보류': 'b-bad', '불일치': 'b-bad', '누락': 'b-bad', '실패': 'b-bad', '형식오류': 'b-bad', '오류': 'b-bad', '반려': 'b-bad',
    '지연': 'b-warn', '부분적재': 'b-warn', '경고': 'b-warn', '승인대기': 'b-warn', '휴업': 'b-warn', '폐업': 'b-bad',
    '중복파일': 'b-info', '도래': 'b-warn', '연결': 'b-warn', '발생': 'b-warn', '보류': 'b-bad', '해소': 'b-ok', '오탐확정': 'b-info',
    '동향확인중': 'b-warn', '조치진행': 'b-warn', '승인대기': 'b-warn', '확인완료': 'b-info', '재점검대기': 'b-info', '종결': 'b-ok', '접수': 'b-info',
    '충돌': 'b-bad', '확인 필요': 'b-warn', '제출': 'b-ok', '임시': 'b-info', '진행': 'b-warn', '참고': 'b-info', '산출불가': 'b-info', '미산출': 'b-info', '비교불가': 'b-info' }[text] || 'b-info';
  return '<span class="badge ' + cls + '">' + h(text) + '</span>';
}
function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(function () { t.className = 'toast'; }, err ? 6000 : 3000);
}
function view(html) { document.getElementById('view').innerHTML = html; }
function loading() { view('<p class="muted">불러오는 중…</p>'); }
function fail(e) { view('<div class="note bad">' + h(e.message || e) + '</div>'); }
function formData(form) {
  var o = {};
  Array.prototype.forEach.call(form.elements, function (el) { if (el.name) o[el.name] = el.value; });
  return o;
}
function table(cols, rows, opt) {
  opt = opt || {};
  if (!rows.length) return '<p class="muted">' + h(opt.empty || '자료 없음') + '</p>';
  var head = cols.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + h(c.t) + '</th>'; }).join('');
  var body = rows.map(function (r, i) {
    var tds = cols.map(function (c) {
      var v = c.f ? c.f(r) : h(r[c.k]);
      return '<td class="' + (c.num ? 'num' : '') + (c.wrap ? ' wrap' : '') + '">' + v + '</td>';
    }).join('');
    return '<tr' + (opt.onRow ? ' class="click" data-i="' + i + '"' : '') + '>' + tds + '</tr>';
  }).join('');
  return '<div class="scroll"><table' + (opt.id ? ' id="' + opt.id + '"' : '') + '><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}
function bindRows(id, rows, fn) {
  var t = document.getElementById(id);
  if (!t) return;
  t.addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-i]');
    if (tr) fn(rows[+tr.getAttribute('data-i')]);
  });
}

/* ───── 상단 ───── */
function renderNav() {
  var items = [['home', '통합 홈', 'home.view'], ['trend', '동향관리', 'work.view'], ['credit', '채권관리', 'work.view'],
    ['ws', '중도매인 조회', 'ws.view'], ['master', '기초자료', 'master.edit'], ['approvals', '승인 대기', 'master.edit'],
    ['perf', '실적관리', 'ws.view'], ['qa', '매뉴얼 질의', 'work.view'], ['rules', '지표·신호 기준', 'work.view'], ['docs', '매뉴얼·서식', 'work.view'], ['import', '가져오기·오류 점검', 'import.view'],
    ['users', '사용자·권한', 'user.manage'], ['audit', '변경·처리 이력', 'audit.view']];
  var cur = (location.hash.replace('#/', '').split('/')[0]) || 'home';
  document.getElementById('nav').innerHTML = items.filter(function (i) { return can(i[2]); }).map(function (i) {
    return '<a href="#/' + i[0] + '" class="' + (cur === i[0] ? 'on' : '') + '">' + i[1] + '</a>';
  }).join('');
}
function renderStatus(st, meta) {
  st = st || {};
  var ds = meta ? meta.dataState : st.data_status || '자료없음';
  var parts = [
    '기준일 <b>' + h(meta ? meta.baseDate : st.latest_base_date || '—') + '</b>',
    meta && meta.period ? '집계기간 <b>' + h(meta.period) + '</b>' : '',
    '최종 갱신 <b>' + h(st.last_updated_at || (meta && meta.lastUpdated) || '—') + '</b>',
    '데이터 상태 ' + badge(ds) + (st.status_reasons && !meta ? ' <span>' + h(st.status_reasons) + '</span>' : '')
  ];
  document.getElementById('statusbar').innerHTML = parts.filter(Boolean).map(function (p) { return '<span>' + p + '</span>'; }).join('');
}

/* ───── 라우팅 ───── */
function route() {
  if (!S.boot) return;
  document.getElementById('view').onclick = null;   // 이전 화면의 클릭 처리 제거
  renderNav();
  var p = location.hash.replace('#/', '').split('/');
  var page = p[0] || 'home';
  var fn = { home: pageHome, ws: p[1] ? function () { page360(decodeURIComponent(p[1]), p[2]); } : pageSearch,
    master: p[1] ? function () { pageMasterDetail(decodeURIComponent(p[1])); } : pageMasterList,
    approvals: pageApprovals, import: pageImport, users: pageUsers, audit: pageAudit,
    trend: pageTrend, credit: pageCredit, rules: pageRules, docs: pageDocs, perf: function () { pagePerf(p[1] ? decodeURIComponent(p[1]) : ''); },
    qa: function () { pageQa(p[1] ? decodeURIComponent(p[1]) : ''); },
    'case': function () { pageCase(decodeURIComponent(p[1] || '')); } }[page] || pageHome;
  renderStatus(S.boot.status);
  fn();
}
window.addEventListener('hashchange', route);

/* ───── 통합 홈 ───── */
function pageHome() {
  loading();
  call('api_home').then(function (d) {
    S.boot.status = d.status; renderStatus(d.status);
    var c = d.counts;
    var html = '<h1>오늘 처리할 일</h1>';
    if (d.status.data_status && d.status.data_status !== '정상') {
      html += '<div class="note bad">데이터 상태가 <b>' + h(d.status.data_status) + '</b>입니다. 이 기간의 수치는 정상으로 판단하지 마세요. ' + h(d.status.status_reasons || '') + '</div>';
    }
    html += workQueueCards(d.work);
    html += '<h2 style="margin-top:16px">기초·데이터</h2><div class="tiles">' +
      tile('담당 중도매인', c.myWholesalers, '명') + tile('담보·보증 기한 도래', c.expiring, '건', APP_WARN_DAYS + '일 이내') +
      tile('데이터 이상 중도매인', c.dataIssues, '명', '최근 7일') +
      (can('import.view') ? tile('가져오기 문제', c.batchProblems, '건') : '') +
      (can('master.edit') ? tile('기초자료 승인 대기', c.pending, '건') : '') + '</div>';
    html += '<div class="grid">';
    html += '<div class="card span2"><h2>④ 담보·보증 기한 도래</h2>' + table([
      { t: '중도매인', f: function (r) { return '<a href="#/ws/' + encodeURIComponent(r.wholesaler_id) + '">' + h(r.wholesaler_id + ' ' + r.name) + '</a>'; } },
      { t: '구분', k: 'kind' }, { t: '내용', k: 'label' }, { t: '만기일', k: 'date' },
      { t: 'D-day', num: true, f: function (r) { return 'D-' + r.dday; } }], d.expiring, { empty: '기한 도래 건 없음' }) + '</div>';
    html += '<div class="card"><h2>⑥ 데이터 갱신 실패·누락</h2>' + table([
      { t: '중도매인', f: function (r) { return '<a href="#/ws/' + encodeURIComponent(r.wholesaler_id) + '">' + h(r.wholesaler_id + ' ' + r.name) + '</a>'; } },
      { t: '내용', wrap: true, f: function (r) { return r.items.slice(0, 3).map(function (i) { return h(i.date) + ' ' + badge(i.status) + ' ' + h(i.detail); }).join('<br>') + (r.items.length > 3 ? '<br><span class="muted">외 ' + (r.items.length - 3) + '건</span>' : ''); } }],
      d.dataIssues, { empty: '최근 7일 데이터 이상 없음' }) +
      (d.batchProblems.length ? '<h3>가져오기 문제</h3>' + table([{ t: '파일', k: 'file_name' }, { t: '상태', f: function (r) { return badge(r.status); } }, { t: '내용', k: 'message', wrap: true }], d.batchProblems) : '') + '</div>';
    if (can('master.edit')) {
      html += '<div class="card"><h2>기초자료 승인 대기</h2>' + table([
        { t: '구분', k: 'tableLabel' }, { t: '중도매인', k: 'wholesaler_id' }, { t: 'ID·버전', f: function (r) { return h(r.id) + ' v' + h(r.version_no); } },
        { t: '요청', f: function (r) { return h(r.requested_by) + '<br><span class="muted">' + h(r.requested_at) + '</span>'; } }, { t: '사유', k: 'change_reason', wrap: true }],
        d.pending, { empty: '승인 대기 없음' }) + (d.pending.length && can('master.approve') ? '<div class="row"><a href="#/approvals">승인 처리 →</a></div>' : '') + '</div>';
    }
    if (d.myList.length) {
      html += '<div class="card"><h2>내 담당 중도매인</h2>' + table([
        { t: '코드', f: function (r) { return '<a href="#/ws/' + encodeURIComponent(r.wholesaler_id) + '">' + h(r.wholesaler_id) + '</a>'; } },
        { t: '상호', k: 'name' }, { t: '영업 상태', f: function (r) { return badge(r.biz_status); } }], d.myList) + '</div>';
    }
    html += '</div>';
    view(html);
  }).catch(fail);
}

/* ───── 업무 대기열(홈·대시보드 공용) ───── */
function caseLink(r) { return '<a href="#/case/' + encodeURIComponent(r.case_id) + '">' + h(r.case_id) + '</a>' + (r.is_recurrence ? ' <span class="badge b-warn">재발</span>' : ''); }
function wsLink(r) { return '<a href="#/ws/' + encodeURIComponent(r.wholesaler_id) + '">' + h(r.wholesaler_id + ' ' + r.name) + '</a>'; }
function sigBadges(list) {
  return (list || []).map(function (s) {
    var cls = { '위험': 'b-bad', '경고': 'b-bad', '주의': 'b-warn', '정보': 'b-info' }[s.severity] || 'b-info';
    return '<span class="badge ' + cls + '" title="' + h(JSON.stringify(s.evidence)) + '">' + h(s.rule_id + ' ' + s.label) + (s.status === '보류' ? '(보류)' : '') + '</span>';
  }).join(' ');
}
function evidenceText(s) {
  var e = s.evidence || {};
  switch (s.rule_id) {
    case 'S01': return '회전율 ' + e.prevTurnover + '회 → ' + e.turnover + '회 (' + e.dropPct + '% 하락), 회수일수 ' + e.collectionDays + '일 · 기간 ' + e.period + ' (직전 ' + e.prevPeriod + ')';
    case 'S02': return '잔액 ' + won(e.balance) + ' / 3개월 평균 ' + won(e.avgBalance) + ' = ' + e.ratio + '배 (+' + won(e.increase) + ')';
    case 'S03': return e.stage + ': 연체 ' + won(e.overdueAmount) + ', ' + e.overdueDays + '일 (' + e.definition + ')';
    case 'S04': return '전년 동월(동일 경과일) ' + e.yoyPct + '%, 직전 3개월 ' + e.ma3Pct + '%, 부류 전체 대비 ' + e.vsMarketPp + '%p (시장 ' + e.marketPct + '%)';
    case 'S05': return '한도 사용률 ' + e.usagePct + '% = ' + won(e.balance) + ' / ' + won(e.limit) + ' (' + e.method + ')';
    case 'S06': return e.kind + ' ' + e.label + ' 만기 ' + e.date + ' (D-' + e.dday + ')';
    case 'S07': return '동시 신호: ' + (e.rules || []).join(', ');
    default: return h(JSON.stringify(e));
  }
}
function workQueueCards(w) {
  if (!w) return '';
  var html = '<div class="tiles">' + tile('신규 조기 신호', w.newSignals.length, '건', '기준일 ' + (w.base || '—')) +
    tile('동향 확인 대기', w.trendWait.length, '건', '지연 ' + w.trendWait.filter(function (x) { return x.overdue; }).length) +
    tile('채권 조치 대기', w.actionWait.length, '건', '지연 ' + w.actionWait.filter(function (x) { return x.overdue; }).length) +
    tile('재점검 예정', w.recheck.length, '건', '도래 ' + w.recheck.filter(function (x) { return x.due; }).length) +
    (w.heldSignals ? tile('판정 보류 신호', w.heldSignals, '건', '자료 불완전') : '') + '</div>';
  html += '<div class="grid">';
  html += '<div class="card span2"><h2>① 신규 조기 신호</h2>' + table([{ t: '중도매인', f: wsLink }, { t: '관리 건', f: caseLink }, { t: '신호', wrap: true, f: function (r) { return sigBadges(r.signals); } },
    { t: '근거', wrap: true, f: function (r) { return r.signals.map(function (s) { return '<div class="muted">' + h(evidenceText(s)) + '</div>'; }).join(''); } }, { t: '담당 경매사', k: 'auctioneer' }], w.newSignals, { empty: '신규 신호 없음' }) + '</div>';
  html += '<div class="card"><h2>② 동향 확인 대기·지연</h2>' + table([{ t: '관리 건', f: caseLink }, { t: '중도매인', f: wsLink }, { t: '기한', f: function (r) { return h(r.trend_due) + (r.overdue ? ' ' + badge('지연') : ''); } }, { t: '담당', k: 'auctioneer' }],
    w.trendWait.slice().sort(function (a, b) { return (a.trend_due || '') < (b.trend_due || '') ? -1 : 1; }), { empty: '대기 없음' }) + '</div>';
  html += '<div class="card"><h2>③ 채권 조치 대기·지연</h2>' + table([{ t: '관리 건', f: caseLink }, { t: '중도매인', f: wsLink }, { t: '상태', f: function (r) { return badge(r.status); } },
    { t: '조치', f: function (r) { return (r.openActions || 0) + '건' + (r.pendingApproval ? ' (승인 대기 ' + r.pendingApproval + ')' : '') + (r.overdue ? ' ' + badge('지연') : ''); } }, { t: '담당', k: 'owner' }], w.actionWait, { empty: '대기 없음' }) + '</div>';
  html += '<div class="card"><h2>⑤ 재점검 예정</h2>' + table([{ t: '관리 건', f: caseLink }, { t: '중도매인', f: wsLink }, { t: '재점검일', f: function (r) { return h(r.recheck_date) + (r.due ? ' ' + badge('도래') : ''); } }, { t: '결과', k: 'result_class' }], w.recheck, { empty: '예정 없음' }) + '</div>';
  html += '<div class="card"><h2>⑦ 담당자별 미처리</h2>' + table([{ t: '담당자', k: 'name' }, { t: '대기', num: true, k: 'waiting' }, { t: '지연', num: true, f: function (r) { return r.overdue ? '<span class="badge b-bad">' + r.overdue + '</span>' : '0'; } }], w.byOwner, { empty: '미처리 없음' }) + '</div>';
  return html + '</div>';
}
var APP_WARN_DAYS = 60;
function tile(k, v, unit, sub) {
  return '<div class="tile"><div class="k">' + h(k) + '</div><div class="v">' + num(v) + ' <small>' + h(unit) + '</small></div>' +
    (sub ? '<div class="k">' + h(sub) + '</div>' : '') + '</div>';
}

/* ───── 중도매인 조회 ───── */
function pageSearch() {
  view('<h1>중도매인 조회</h1><div class="row"><input id="q" placeholder="코드 또는 상호" autofocus> <button class="primary" id="go">검색</button></div><div id="res"></div>');
  var go = function () {
    document.getElementById('res').innerHTML = '<p class="muted">검색 중…</p>';
    call('api_searchWholesalers', document.getElementById('q').value).then(function (rows) {
      document.getElementById('res').innerHTML = table([{ t: '코드', k: 'wholesaler_id' }, { t: '상호', k: 'name' },
        { t: '영업 상태', f: function (r) { return badge(r.biz_status); } }, { t: '취급 부류', k: 'categories' }, { t: '담당 경매사', k: 'assignees' }],
        rows, { id: 'wsTbl', onRow: true, empty: '조회 가능한 중도매인이 없습니다.' });
      bindRows('wsTbl', rows, function (r) { location.hash = '#/ws/' + encodeURIComponent(r.wholesaler_id); });
    }).catch(function (e) { document.getElementById('res').innerHTML = '<div class="note bad">' + h(e.message) + '</div>'; });
  };
  document.getElementById('go').onclick = go;
  document.getElementById('q').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  go();
}

/* ───── 중도매인 통합 상세 ───── */
function page360(wsId, asOf) {
  loading();
  call('api_get360', wsId, asOf || '').then(function (d) {
    var m = d.meta, w = d.ws, c = d.credit;
    renderStatus(S.boot.status, { baseDate: m.baseDate, period: m.period, lastUpdated: m.lastUpdated, dataState: d.dataState.state });
    var html = '<div class="row" style="justify-content:space-between"><h1>' + h(w.wholesaler_id + ' ' + w.name) + ' ' + badge(w.biz_status_asof || w.biz_status_now) + '</h1>' +
      '<div class="row"><label class="muted">기준일로 보기 <input type="date" id="asOf" value="' + h(m.asOf) + '"></label><button id="asOfGo">조회</button>' +

function metricVal(m) {
  if (/증감|사용률/.test(m.metric)) return (m.value * 100).toFixed(1) + (m.metric === '구매증감_시장대비' ? '%p' : '%');
  if (/회전율/.test(m.metric)) return Number(m.value).toFixed(2) + '회';
  if (/일수/.test(m.metric)) return Number(m.value).toFixed(1) + '일';
  return won(m.value);
}

function trendBlock(trend) {
  if (!trend.length) return '<p class="muted">집계 자료 없음</p>';
  return '<div class="tabs" id="catTabs">' + ['전체', '과일', '채소'].map(function (c) {
    return '<button data-c="' + c + '" class="' + (S.cat === c ? 'on' : '') + '">' + c + '</button>';
  }).join('') + '</div><div id="trendChart"></div><div id="trendTable"></div>';
}
function bindTrend(trend) {
  var tabs = document.getElementById('catTabs');
  if (!tabs) return;
  var draw = function () {
    Array.prototype.forEach.call(tabs.children, function (b) { b.className = b.getAttribute('data-c') === S.cat ? 'on' : ''; });
    document.getElementById('trendChart').innerHTML = trendSvg(trend, S.cat);
    document.getElementById('trendTable').innerHTML = table([
      { t: '월', f: function (r) { return h(r.ym) + (r.partial ? ' <span class="badge b-warn">진행 중</span>' : ''); } },
      { t: '구매금액', num: true, f: function (r) { return won(r.byCategory[S.cat].amount); } },
      { t: '구매일수', num: true, f: function (r) { return num(r.byCategory[S.cat].purchaseDays); } },
      { t: '전년 동월', num: true, f: function (r) { return r.partial ? won(r.mtd.byCategory[S.cat].prevAmount) + '<br><span class="muted">' + h(r.mtd.basis) + ' ' + r.mtd.elapsedAuctionDays + '일</span>' : won(r.byCategory[S.cat].prevYearAmount); } },
      { t: '전년 대비', num: true, f: function (r) { return r.partial ? pct(r.mtd.byCategory[S.cat].growth) : pct(r.byCategory[S.cat].yoy); } }
    ], trend.slice().reverse());
  };
  tabs.onclick = function (e) { var c = e.target.getAttribute('data-c'); if (c) { S.cat = c; draw(); } };
  draw();
}
/* 막대: 당해(series-1), 전년 대응 월(series-2). 진행 중인 월의 전년 막대는 동일 경과 경매일 기준 금액 */
function trendSvg(trend, cat) {
  var W = 760, H = 220, L = 56, B = 28, T = 10, R = 8;
  var vals = trend.map(function (t) {
    var b = t.byCategory[cat];
    return { ym: t.ym, cur: b.amount || 0, prev: t.partial ? t.mtd.byCategory[cat].prevAmount : (b.prevYearAmount || 0), partial: t.partial };
  });
  var max = Math.max.apply(null, vals.map(function (v) { return Math.max(v.cur, v.prev); }).concat([1]));
  var step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  var pw = (W - L - R) / vals.length, bw = Math.min(16, (pw - 8) / 2), y = function (v) { return T + (H - T - B) * (1 - v / nice); };
  var g = '';
  for (var i = 0; i <= 4; i++) {
    var v = nice * i / 4, yy = y(v);
    g += '<g class="grid"><line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/></g>' +
      '<text class="axis" x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + Math.round(v / 10000).toLocaleString('ko-KR') + '</text>';
  }
  vals.forEach(function (v, i) {
    var cx = L + pw * i + pw / 2;
    var bar = function (x, val, cls, label) {
      var top = y(val), hgt = Math.max(0, H - B - top), r = Math.min(4, hgt);
      return '<path class="bar ' + cls + '" d="M' + x + ',' + (H - B) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top +
        'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + (H - B) + 'Z"><title>' + label + '</title></path>';
    };
    g += bar(cx - bw - 1, v.prev, 's2', h(v.ym) + ' 전년 대응' + (v.partial ? '(동일 경과일)' : '') + ': ' + won(v.prev));
    g += bar(cx + 1, v.cur, 's1', h(v.ym) + (v.partial ? '(진행 중)' : '') + ': ' + won(v.cur));
    g += '<text class="axis" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + v.ym.substring(2).replace('-', '.') + (v.partial ? '*' : '') + '</text>';
  });
  return '<div class="legend"><span><i style="background:var(--series-1)"></i>당해</span><span><i style="background:var(--series-2)"></i>전년 대응 월</span><span>단위: 만원 · *진행 중인 월은 동일 경과 경매일 기준 비교</span></div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="최근 12개월 ' + h(cat) + ' 구매금액">' + g + '</svg>';
}

/* 매트릭스: x 로그 눈금(구매금액), y 회전율, 색 = 전년 동기 누적 증감(감소 주황, 증가 청록, 비교불가 회색), 크기 = 미수금 */
function matrixHtml(mx) {
  var W = 760, H = 460, L = 60, R = 20, T = 20, B = 44;
  var pts = mx.points;
  var html = '<div class="note">' + h(mx.disclaimer) + '</div>';
  html += '<div class="legend"><span>가로축: ' + h(mx.axes.x) + '</span><span>세로축: ' + h(mx.axes.y) + '</span></div><div class="legend"><span>색: ' + h(mx.axes.color) + ' — <i style="background:#1baf7a"></i>증가 <i style="background:#eb6834"></i>감소 <i style="background:#9a9a94"></i>비교불가</span><span>크기: ' + h(mx.axes.size) + '</span></div>';
  if (!pts.length) return html + '<p class="muted">표시할 점 없음</p>';
  var xs = pts.map(function (p) { return Math.max(p.x, 1); }), ys = pts.map(function (p) { return p.y; });
  var lx0 = Math.log10(Math.min.apply(null, xs)) - 0.1, lx1 = Math.log10(Math.max.apply(null, xs)) + 0.1;
  var y0 = 0, y1 = Math.max.apply(null, ys.concat([mx.boundaries.y])) * 1.15;
  var X = function (v) { return L + (Math.log10(Math.max(v, 1)) - lx0) / (lx1 - lx0) * (W - L - R); }, Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
  var smax = Math.max.apply(null, pts.map(function (p) { return p.size; }).concat([1]));
  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="거래·회수 매트릭스">';
  // 사분면 배경 라벨
  var bx = X(mx.boundaries.x), by = Y(mx.boundaries.y);
  svg += '<line x1="' + bx + '" x2="' + bx + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--text-2)" stroke-dasharray="4 4"/><line x1="' + L + '" x2="' + (W - R) + '" y1="' + by + '" y2="' + by + '" stroke="var(--text-2)" stroke-dasharray="4 4"/>';
  var lab = function (x, y, t, anchor) { return '<text class="axis" x="' + x + '" y="' + y + '" text-anchor="' + anchor + '" font-weight="600">' + h(t) + '</text>'; };
  svg += lab(W - R - 4, T + 14, mx.quadrants.HH.label + ' ' + mx.counts.HH, 'end') + lab(W - R - 4, H - B - 6, mx.quadrants.HL.label + ' ' + mx.counts.HL, 'end') + lab(L + 4, T + 14, mx.quadrants.LH.label + ' ' + mx.counts.LH, 'start') + lab(L + 4, H - B - 6, mx.quadrants.LL.label + ' ' + mx.counts.LL, 'start');
  // 축 눈금
  for (var e = Math.ceil(lx0); e <= Math.floor(lx1); e++) { var xv = Math.pow(10, e); svg += '<text class="axis" x="' + X(xv) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + (xv / 1e8 >= 1 ? (xv / 1e8) + '억' : (xv / 1e4) + '만') + '</text>'; }
  for (var k = 0; k <= 4; k++) { var yv = y0 + (y1 - y0) * k / 4; svg += '<g class="grid"><line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(yv) + '" y2="' + Y(yv) + '"/></g><text class="axis" x="' + (L - 6) + '" y="' + (Y(yv) + 4) + '" text-anchor="end">' + yv.toFixed(1) + '회</text>'; }
  svg += '<text class="axis" x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle">최근 12개월 구매금액(로그 눈금) · 경계 ' + Math.round(mx.boundaries.x / 1e4).toLocaleString() + '만원(' + h(mx.boundaries.xSource) + ')</text>';
  svg += '<text class="axis" transform="translate(14,' + (H / 2) + ') rotate(-90)" text-anchor="middle">회전율(전체) · 경계 ' + mx.boundaries.y.toFixed(2) + '회(' + h(mx.boundaries.ySource) + ')</text>';
  pts.forEach(function (p) {
    var r = 5 + 14 * Math.sqrt(p.size / smax);
    var col = p.growth.status !== '정상' ? '#9a9a94' : (p.growth.value < 0 ? '#eb6834' : '#1baf7a');
    svg += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + r + '" fill="' + col + '" fill-opacity="0.75" stroke="var(--surface)" stroke-width="2"><title>' + h(p.wholesaler_id + ' ' + p.name) + '\n' + h(p.quadrantLabel) + '\n구매 ' + won(p.x) + ' · 회전율 ' + p.y.toFixed(2) + '회 · 미수금 ' + won(p.size) + '\n전년 동기 누적 대비 ' + (p.growth.status === '정상' ? (p.growth.value * 100).toFixed(1) + '%' : p.growth.reason) + '</title></circle>';
    svg += '<text class="axis" x="' + (X(p.x) + r + 2) + '" y="' + (Y(p.y) + 3) + '">' + h(p.wholesaler_id) + '</text>';
  });
  svg += '</svg>';
  html += svg;
  html += '<h3>분류 표</h3>' + table([{ t: '중도매인', f: function (p) { return h(p.wholesaler_id + ' ' + p.name); } }, { t: '분류', f: function (p) { return '<span class="badge ' + ({ HH: 'b-ok', HL: 'b-bad', LH: 'b-info', LL: 'b-warn' }[p.quadrant]) + '">' + h(p.quadrantLabel) + '</span>'; } },
    { t: '12개월 구매', num: true, f: function (p) { return won(p.x); } }, { t: '회전율', num: true, f: function (p) { return p.y.toFixed(2); } }, { t: '회수일수', num: true, f: function (p) { return p.collectionDays === null ? '—' : p.collectionDays.toFixed(1); } },
    { t: '미수금', num: true, f: function (p) { return won(p.size); } }, { t: '전년 누적 대비', num: true, f: function (p) { return pct(p.growth); } }], pts.slice().sort(function (a, b) { return a.quadrant === b.quadrant ? b.x - a.x : a.quadrant.localeCompare(b.quadrant); }), { id: 'mxTbl', onRow: true });
  html += '<h3>그래프 밖 (분류 제외)</h3>' + table([{ t: '중도매인', f: function (p) { return h(p.wholesaler_id + ' ' + p.name); } }, { t: '사유', k: 'reason' }, { t: '12개월 구매', num: true, f: function (p) { return won(p.x); } }], mx.excluded, { empty: '없음' });
  html += '<div class="note">경계선: 가로축은 부류 필터별 당기 중앙값, 세로축은 전년도 연간 중앙값 고정(지표·신호 기준 화면 "기준선 재산정") 또는 내부 목표값. 산정 시각 ' + h(mx.boundaries.computedAt) + '</div>';
  return html;
}

/* ───── 매뉴얼 질의 ───── */
function pageQa(caseId) {
  view('<h1>매뉴얼 질의</h1><div class="note">등록된 매뉴얼·절차에서 근거를 찾아 답합니다. 근거가 없으면 절차를 만들지 않고 "확인 필요"로 답합니다. 자유 질의 AI는 조직 승인 후 설정에서 켤 수 있으며, 꺼져 있어도 이 화면은 동작합니다.</div>' +
    '<form class="row" id="qf"><input name="q" style="flex:1;min-width:240px" placeholder="예: 연체 30일 넘었을 때 절차, 담보 재평가 주기" required>' + (caseId ? '<span class="badge b-info">관리 건 ' + h(caseId) + '</span>' : '') + '<button class="primary">질의</button></form><div id="qa"></div>');
  document.getElementById('qf').onsubmit = function (e) {
    e.preventDefault();
    var q = document.getElementById('qf').q.value;
    document.getElementById('qa').innerHTML = '<p class="muted">검색 중…</p>';
    call('api_askManual', q, caseId).then(function (a) {
      var html = '<div class="card"><div class="note">[기준] 중도매인 데이터 기준일 ' + h(a.basis.data_base_date) + ' (' + h(a.basis.data_status) + ') · 매뉴얼: ' + (a.basis.manual_versions.map(h).join(', ') || '등록 문서 없음') + '</div>' +
        '<p><b>' + h(a.query) + '</b> ' + badge(a.status) + '</p>' + (a.message ? '<div class="note ' + (a.status === '충돌' ? 'bad' : 'warn') + '">' + h(a.message) + '</div>' : '') +
        '<h3>1. 확인된 상황</h3>' + (a.facts.length ? '<ul>' + a.facts.map(function (f) { return '<li>' + h(f) + '</li>'; }).join('') + '</ul>' : '<p class="muted">' + (caseId ? '—' : '관리 건을 지정하면 그 건의 신호·확인 결과가 표시됩니다') + '</p>') +
        '<h3>2. 추가 확인사항</h3>' + (a.furtherChecks.length ? '<ul>' + a.furtherChecks.map(function (f) { return '<li>' + h(f) + '</li>'; }).join('') + '</ul>' : '<p class="muted">—</p>') +
        '<h3>3. 적용 가능한 절차 · 4. 근거</h3>' + (a.procedures.length ? a.procedures.map(function (p) {
          var head = '<p><b>' + h(p.label) + '</b> <span class="muted">(' + h(p.situation_code) + ')</span> ' + badge(p.status) + '</p>';
          if (!p.steps.length) return head + '<div class="note warn">' + h(p.message) + '</div>';
          return head + (p.status === '충돌' ? '<div class="note bad">' + h(p.message) + '</div>' : '') + table([{ t: '단계', num: true, k: 'step_no' }, { t: '절차', k: 'content', wrap: true }, { t: '확인사항', k: 'checks', wrap: true },
            { t: '근거(문서·버전·조항·쪽수·시행일)', wrap: true, f: function (s) { return h(s.doc_name + ' ' + s.version + ' ' + s.article) + (s.page ? ' p.' + h(s.page) : '') + '<br><span class="muted">시행 ' + h(s.effective_from) + '</span>'; } }], p.steps);
        }).join('') : '<p class="muted">해당 절차 없음</p>') +
        '<h3>5. 필요 서식</h3>' + (a.forms.length ? '<ul>' + a.forms.map(function (f) { return '<li>' + h(f.form_name + ' ' + f.version) + (f.available ? ' <button data-blank="' + h(f.form_doc_id) + '">빈 서식</button>' : ' <span class="badge b-warn">파일 없음</span>') + '</li>'; }).join('') + '</ul>' : '<p class="muted">—</p>') +
        '<h3>6. 다음 할 일</h3><ul>' + a.nextSteps.map(function (n) { return '<li>' + h(n) + '</li>'; }).join('') + '</ul>' +
        '<h3>AI 답변(선택 기능)</h3>' + (a.ai.used ? '<div class="note">' + h(a.ai.text) + '<br><span class="muted">' + h(a.ai.note) + '</span></div>' : '<p class="muted">' + h(a.ai.status) + ' — ' + h(a.ai.reason) + '</p>') + '</div>';
      document.getElementById('qa').innerHTML = html;
      document.getElementById('qa').onclick = function (ev) { var b = ev.target.closest('button[data-blank]'); if (b) call('api_blankForm', b.getAttribute('data-blank')).then(function (r) { window.open(r.url, '_blank'); }).catch(function (x) { toast(x.message, true); }); };
    }).catch(function (e) { document.getElementById('qa').innerHTML = '<div class="note bad">' + h(e.message) + '</div>'; });
  };
}

/* ───── 시작 ───── */
function showLogin(msg) {
  document.getElementById('who').innerHTML = '';
  document.getElementById('nav').innerHTML = '';
  view('<div class="card" style="max-width:420px;margin:40px auto"><h2>로그인</h2>' + (msg ? '<div class="note warn">' + h(msg) + '</div>' : '') +
    '<form class="f" id="lf"><label class="full">이메일<input name="email" type="email" required autocomplete="username"></label><label class="full">접속코드<input name="code" required autocomplete="current-password" style="text-transform:uppercase"></label>' +
    '<div class="full"><button class="primary">로그인</button></div></form><div class="note">접속코드는 관리자가 개인별로 발급합니다. 코드를 모르면 관리자에게 문의하세요. 공용 PC에서는 사용 후 로그아웃하세요.</div></div>');
  document.getElementById('lf').onsubmit = function (e) {
    e.preventDefault(); var o = formData(e.target);
    rawCall('api_login', [o.email, o.code]).then(function (r) { setToken(r.token); start(); }).catch(function (err) { toast(err.message, true); });
  };
}
function start() {
  call('api_bootstrap').then(function (b) {
    S.boot = b;
    document.getElementById('appVer').textContent = 'v' + b.app.version;
    document.getElementById('who').innerHTML = h(b.user.name) + ' (' + h(b.user.roleLabel) + ')' + (S.codeMode ? ' <button id="logout" style="margin-left:8px;padding:2px 8px;font-size:12px">로그아웃</button>' : '');
    var lo = document.getElementById('logout'); if (lo) lo.onclick = function () { call('api_logout').catch(function () {}).then(function () { setToken(''); showLogin('로그아웃했습니다.'); }); };
    if (!location.hash || location.hash === '#/') location.hash = '#/home';
    route();
  }).catch(function (e) {
    if (S.codeMode) return showLogin(/SESSION_EXPIRED/.test(e.message) ? '' : e.message);
    document.getElementById('who').textContent = '';
    view('<div class="note bad"><b>접속할 수 없습니다.</b><br>' + h(e.message || e) + '</div>');
  });
}
rawCall('api_authInfo', []).then(function (a) {
  S.codeMode = a.mode === 'code' && !a.googleIdentified;   // Google 계정으로 식별되면 토큰 없이 그대로 사용
  if (S.codeMode && !token()) return showLogin('');
  start();
}).catch(function (e) { view('<div class="note bad">' + h(e.message || e) + '</div>'); });
</script>
