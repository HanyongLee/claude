<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중도매인 통합관리 스냅샷</title>
<!--STYLES-->
<style>
  .snap-head { font-size: 12px; color: var(--text-2); }
  .form-box { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .hidden { display: none; }
  details > summary { cursor: pointer; font-weight: 600; margin: 6px 0; }
</style>
</head>
<body>
<header class="topbar"><div class="brand">중도매인 통합관리 <span class="ver" id="snapFor"></span></div><nav id="nav"></nav><div class="who" id="who"></div></header>
<div class="statusbar" id="statusbar"></div>
<main id="view"><p class="muted">자료를 읽는 중…</p></main>
<script>
var DATA = /*DATA*/null;
'use strict';
/* 서버 호출 없이 DATA 만으로 그린다. 화면 구성은 웹앱과 같게 유지 */
function h(v) { return v === null || v === undefined ? '' : String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function won(n) { return n === null || n === undefined || n === '' ? '—' : Number(n).toLocaleString('ko-KR') + '원'; }
function num(n) { return n === null || n === undefined || n === '' ? '—' : Number(n).toLocaleString('ko-KR'); }
function pct(g) { if (!g) return '—'; if (g.status !== '정상') return '<span class="muted">' + h(g.status) + '</span>'; return (g.value > 0 ? '+' : '') + (g.value * 100).toFixed(1) + '%'; }
function badge(t) { var cls = { '정상': 'b-ok', '판정보류': 'b-bad', '지연': 'b-warn', '휴업': 'b-warn', '폐업': 'b-bad', '위험': 'b-bad', '경고': 'b-bad', '주의': 'b-warn', '정보': 'b-info', '동향확인중': 'b-warn', '조치진행': 'b-warn', '승인대기': 'b-warn', '재점검대기': 'b-info', '종결': 'b-ok', '확인 필요': 'b-warn', '충돌': 'b-bad', '보류': 'b-bad' }[t] || 'b-info'; return '<span class="badge ' + cls + '">' + h(t) + '</span>'; }
function table(cols, rows, empty) {
  if (!rows.length) return '<p class="muted">' + h(empty || '자료 없음') + '</p>';
  return '<div class="scroll"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + h(c.t) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="' + (c.num ? 'num' : '') + (c.wrap ? ' wrap' : '') + '">' + (c.f ? c.f(r) : h(r[c.k])) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
function tile(k, v, u, s) { return '<div class="tile"><div class="k">' + h(k) + '</div><div class="v">' + h(v) + ' <small>' + h(u || '') + '</small></div>' + (s ? '<div class="k">' + h(s) + '</div>' : '') + '</div>'; }
function ev(s) { var e = s.evidence || {}; switch (s.rule_id) {
  case 'S01': return '회전율 ' + e.prevTurnover + '→' + e.turnover + ' (' + e.dropPct + '% 하락), 회수일수 ' + e.collectionDays + '일';
  case 'S02': return '잔액 ' + won(e.balance) + ' / 평균 ' + won(e.avgBalance) + ' = ' + e.ratio + '배';
  case 'S03': return e.stage + ': 연체 ' + won(e.overdueAmount) + ', ' + e.overdueDays + '일';
  case 'S04': return '전년 동월 ' + e.yoyPct + '%, 3개월 ' + e.ma3Pct + '%, 시장 대비 ' + e.vsMarketPp + '%p';
  case 'S05': return '한도 사용률 ' + e.usagePct + '%';
  case 'S06': return e.kind + ' ' + e.label + ' 만기 ' + e.date + ' (D-' + e.dday + ')';
  case 'S07': return '동시 신호: ' + (e.rules || []).join(', ');
  default: return JSON.stringify(e); } }
var wsName = {}; (DATA.wholesalers || []).forEach(function (w) { wsName[w.wholesaler_id] = w.name; });
function wsCell(id) { return '<a href="#ws-' + h(id) + '">' + h(id + ' ' + (wsName[id] || '')) + '</a>'; }
function caseCell(id) { return '<a href="#case-' + h(id) + '">' + h(id) + '</a>'; }

function render() {
  var d = DATA, q = d.queues, st = d.status;
  document.getElementById('snapFor').textContent = d.for_user.name + ' (' + d.for_user.role + ') 용 · ' + d.generated_at + ' 생성';
  document.getElementById('who').textContent = '오프라인 스냅샷';
  document.getElementById('statusbar').innerHTML = '<span>기준일 <b>' + h(st.base_date) + '</b></span><span>집계기간 <b>' + h(d.meta.period12) + '</b></span><span>최종 갱신 <b>' + h(st.last_updated) + '</b></span><span>데이터 상태 ' + badge(st.data_status || '자료없음') + '</span>' + (st.ar_available === '아니오' ? '<span class="badge b-warn">미수·입금 자료 없음 → 회전율·연체 미산출</span>' : '');
  document.getElementById('nav').innerHTML = ['home|오늘 할 일', 'ws|중도매인', 'matrix|매트릭스', 'cases|관리 건', 'proc|절차 안내', 'trend|동향보고 작성'].map(function (x) { var p = x.split('|'); return '<a href="#' + p[0] + '">' + p[1] + '</a>'; }).join('');
  var html = '';
  if (st.data_status && st.data_status !== '정상') html += '<div class="note bad">데이터 상태 <b>' + h(st.data_status) + '</b>: ' + h(st.status_reasons) + '</div>';
  html += '<div class="note">' + h(d.notes.privacy) + '</div>';
  // 홈
  html += '<section id="home"><h1>오늘 처리할 일</h1><div class="tiles">' + tile('신규 조기 신호', q.newSignals.length, '건', '기준일 ' + q.base) + tile('동향 확인 대기', q.trendWait.length, '건', '지연 ' + q.trendWait.filter(function (x) { return x.overdue; }).length) + tile('채권 조치 대기', q.actionWait.length, '건') + tile('재점검 예정', q.recheck.length, '건') + tile('담당 중도매인', d.wholesalers.length, '명') + '</div>';
  html += '<div class="grid"><div class="card span2"><h2>① 신규 조기 신호</h2>' + table([{ t: '중도매인', f: function (r) { return wsCell(r.wholesaler_id); } }, { t: '관리 건', f: function (r) { return caseCell(r.case_id); } }, { t: '신호', wrap: true, f: function (r) { return r.signals.map(function (s) { return badge(s.severity) + ' ' + h(s.rule_id + ' ' + s.label); }).join('<br>'); } }, { t: '근거', wrap: true, f: function (r) { return r.signals.map(function (s) { return '<div class="muted">' + h(ev(s)) + '</div>'; }).join(''); } }], q.newSignals, '신규 신호 없음') + '</div>';
  html += '<div class="card"><h2>② 동향 확인 대기</h2>' + table([{ t: '관리 건', f: function (r) { return caseCell(r.case_id); } }, { t: '중도매인', f: function (r) { return wsCell(r.wholesaler_id); } }, { t: '기한', f: function (r) { return h(r.trend_due) + (r.overdue ? ' ' + badge('지연') : ''); } }], q.trendWait, '대기 없음') + '</div>';
  html += '<div class="card"><h2>③ 채권 조치 대기</h2>' + table([{ t: '관리 건', f: function (r) { return caseCell(r.case_id); } }, { t: '중도매인', f: function (r) { return wsCell(r.wholesaler_id); } }, { t: '상태', f: function (r) { return badge(r.status); } }], q.actionWait, '대기 없음') + '</div>';
  html += '<div class="card"><h2>⑤ 재점검 예정</h2>' + table([{ t: '관리 건', f: function (r) { return caseCell(r.case_id); } }, { t: '재점검일', k: 'recheck_date' }], q.recheck, '없음') + '</div></div></section>';
  // 중도매인
  html += '<section id="ws"><h1>중도매인 현황</h1>' + (d.notes.partial ? '<div class="note warn">' + h(d.notes.partial) + '</div>' : '') + '<div class="note">' + h(d.notes.turnover) + '</div>';
  html += table([{ t: '중도매인', f: function (w) { return '<a href="#ws-' + h(w.wholesaler_id) + '">' + h(w.wholesaler_id + ' ' + w.name) + '</a>' + (w.isNew ? ' ' + badge('신규') : '') + (w.biz_status !== '정상' ? ' ' + badge(w.biz_status) : '') + (w.dataState !== '정상' ? ' ' + badge('판정보류') : ''); } }, { t: '담당', k: 'assignee' },
    { t: '12개월 구매', num: true, f: function (w) { return won(w.byCategory['전체'].amount12); } }, { t: '전년 동월', num: true, f: function (w) { return pct(w.byCategory['전체'].lastMonth.yoy); } }, { t: '전년 누적', num: true, f: function (w) { return pct(w.byCategory['전체'].ytd.growth); } },
    { t: '미수 잔액', num: true, f: function (w) { return won(w.balance); } }, { t: '회전율', num: true, f: function (w) { return w.turnover === null ? '<span class="muted">' + h(w.turnoverInfo.status) + '</span>' : w.turnover.toFixed(2); } }, { t: '연체', num: true, f: function (w) { return won(w.overdue); } },
    { t: '활성 신호', wrap: true, f: function (w) { return d.signals.filter(function (s) { return s.wholesaler_id === w.wholesaler_id; }).map(function (s) { return h(s.rule_id); }).join(', '); } }], d.wholesalers.slice().sort(function (a, b) { return b.byCategory['전체'].amount12 - a.byCategory['전체'].amount12; }));
  d.wholesalers.forEach(function (w) {
    html += '<details id="ws-' + h(w.wholesaler_id) + '"><summary>' + h(w.wholesaler_id + ' ' + w.name) + ' — 상세</summary><div class="grid">' +
      '<div class="card"><h2>구매 실적</h2>' + table([{ t: '부류', k: 'c' }, { t: '12개월', num: true, f: function (r) { return won(r.v.amount12); } }, { t: '구매일수', num: true, f: function (r) { return num(r.v.days12); } }, { t: '전년 동월', num: true, f: function (r) { return pct(r.v.lastMonth.yoy); } }, { t: '전년 누적', num: true, f: function (r) { return pct(r.v.ytd.growth); } }], Object.keys(w.byCategory).map(function (c) { return { c: c, v: w.byCategory[c] }; })) + '</div>' +
      '<div class="card"><h2>한도·담보·보증</h2>' + table([{ t: '유형', k: 'limit_type' }, { t: '금액', num: true, f: function (l) { return won(l.amount); } }, { t: '적용', f: function (l) { return h(l.valid_from) + '~' + h(l.valid_to === '9999-12-31' ? '' : l.valid_to); } }], w.limits, '한도 없음') +
      table([{ t: '담보', k: 'type' }, { t: '설정금액', num: true, f: function (c) { return won(c.set_amount); } }, { t: '내부 인정', num: true, f: function (c) { return c.recognized_amount === '' ? '<span class="muted">미확인</span>' : won(c.recognized_amount); } }, { t: '만기', k: 'expiry_date' }], w.collaterals, '담보 없음') +
      (w.guarantee ? '<p>연대보증: ' + h(w.guarantee.has) + (w.guarantee.scope ? ' (' + h(w.guarantee.scope) + ')' : '') + '</p>' : '<p class="muted">보증 정보 없음</p>') + '</div>' +
      '<div class="card"><h2>신호</h2>' + table([{ t: '신호', f: function (s) { return badge(s.severity) + ' ' + h(s.rule_id + ' ' + s.label); } }, { t: '상태', f: function (s) { return badge(s.status); } }, { t: '최초', k: 'first_date' }, { t: '근거', wrap: true, f: function (s) { return h(ev(s)); } }], d.signals.filter(function (s) { return s.wholesaler_id === w.wholesaler_id; }), '신호 없음') + '</div></div></details>';
  });
  html += '</section>';
  // 매트릭스
  var m = d.matrix;
  html += '<section id="matrix"><h1>거래·회수 매트릭스</h1><div class="note">' + h(m.disclaimer) + '</div>' + (m.points.length ? '<p class="muted">경계: 구매 ' + won(m.boundaries.x) + ' (' + h(m.boundaries.xSource) + ') · 회전율 ' + (m.boundaries.y === null ? '—' : m.boundaries.y.toFixed(2)) + ' (' + h(m.boundaries.ySource) + ')</p>' +
    table([{ t: '중도매인', f: function (p) { return wsCell(p.wholesaler_id); } }, { t: '분류', f: function (p) { return badge(p.quadrantLabel); } }, { t: '12개월 구매', num: true, f: function (p) { return won(p.x); } }, { t: '회전율', num: true, f: function (p) { return p.y.toFixed(2); } }, { t: '미수금', num: true, f: function (p) { return won(p.size); } }, { t: '전년 누적', num: true, f: function (p) { return pct(p.growth); } }], m.points) : '<p class="muted">회전율을 산출할 수 없어 분류할 점이 없습니다(미수 자료 필요).</p>') +
    '<h3>분류 제외</h3>' + table([{ t: '중도매인', f: function (p) { return wsCell(p.wholesaler_id); } }, { t: '사유', k: 'reason' }], m.excluded, '없음') + '</section>';
  // 관리 건
  html += '<section id="cases"><h1>관리 건</h1>' + (d.cases.length ? d.cases.map(function (c) {
    var sg = d.signals.filter(function (s) { return s.case_id === c.case_id; }), tr = d.trends.filter(function (t) { return t.case_id === c.case_id; }), ac = d.actions.filter(function (a) { return a.case_id === c.case_id; });
    return '<div class="card" id="case-' + h(c.case_id) + '" style="margin-bottom:12px"><h2>' + h(c.case_id) + ' ' + badge(c.status) + (c.is_recurrence ? ' ' + badge('재발') : '') + ' — ' + wsCell(c.wholesaler_id) + '</h2>' +
      '<dl class="kv"><dt>개시</dt><dd>' + h(c.opened_date) + '</dd><dt>담당 경매사</dt><dd>' + h(c.auctioneer || '미지정') + '</dd><dt>기한</dt><dd>동향 ' + h(c.trend_due || '—') + ' · 조치 ' + h(c.action_due || '—') + ' · 재점검 ' + h(c.recheck_date || '—') + '</dd>' + (c.result_class ? '<dt>확인 결과</dt><dd>' + h(c.result_class) + '</dd>' : '') + '</dl>' +
      '<h3>신호</h3>' + table([{ t: '신호', f: function (s) { return badge(s.severity) + ' ' + h(s.rule_id + ' ' + s.label); } }, { t: '근거', wrap: true, f: function (s) { return h(ev(s)); } }], sg, '신호 없음') +
      '<h3>동향보고</h3>' + table([{ t: '버전', f: function (t) { return 'v' + h(t.version); } }, { t: '확인', f: function (t) { return h(t.checked_date + ' ' + t.check_method); } }, { t: '사실', wrap: true, f: function (t) { return t.facts.map(h).join('<br>'); } }, { t: '결과', k: 'result_class' }, { t: '출처', k: 'official_source' }], tr, '없음') +
      '<h3>조치</h3>' + table([{ t: '유형', k: 'action_type' }, { t: '내용', k: 'content', wrap: true }, { t: '기한', k: 'due_date' }, { t: '승인', f: function (a) { return badge(a.approval_status); } }, { t: '상태', f: function (a) { return badge(a.status); } }], ac, '없음') +
      (c.status === '동향확인중' || c.status === '접수' ? '<p><a href="#trend" onclick="pickCase(\'' + h(c.case_id) + '\')"><button class="primary">이 관리 건 동향보고 작성</button></a></p>' : '') + '</div>';
  }).join('') : '<p class="muted">관리 건 없음</p>') + '</section>';
  // 절차
  html += '<section id="proc"><h1>상황별 절차·근거 안내</h1>' + d.situations.map(function (s) {
    return '<div class="card" style="margin-bottom:8px"><h2>' + h(s.label) + ' <span class="muted" style="font-size:12px">' + h(s.situation_code) + '</span> ' + badge(s.status) + '</h2>' + (s.steps.length ? (s.status === '충돌' ? '<div class="note bad">' + h(s.message) + '</div>' : '') + table([{ t: '단계', num: true, k: 'step_no' }, { t: '절차', k: 'content', wrap: true }, { t: '확인사항', k: 'checks', wrap: true }, { t: '근거', wrap: true, f: function (x) { return h(x.basis) + '<br><span class="muted">시행 ' + h(x.effective_from) + '</span>'; } }, { t: '서식', f: function (x) { return x.forms.map(h).join(', ') || '—'; } }], s.steps) : '<div class="note warn">' + h(s.message) + '</div>') + '</div>';
  }).join('') + '</section>';
  // 동향보고 폼
  html += '<section id="trend"><h1>동향보고 작성 (파일 제출)</h1><div class="note">작성 후 "파일 만들기"를 누르면 TREND_….json 파일이 내려옵니다. 사내 메일로 채권담당에게 보내면 다음 정기 처리 때 시스템에 반영됩니다. 공식 원본은 이 파일이며, 사실과 의견은 반드시 구분해 적으세요.</div>' +
    '<form class="f" id="tf"><label>관리 건*<select name="case_id" id="caseSel">' + d.cases.filter(function (c) { return c.status !== '종결' && c.status !== '재점검대기'; }).map(function (c) { return '<option value="' + h(c.case_id) + '">' + h(c.case_id + ' ' + (wsName[c.wholesaler_id] || c.wholesaler_id)) + '</option>'; }).join('') + '</select></label>' +
    '<label>작성자 이메일*<input name="writer_id" value="' + h(d.for_user.user_id) + '"></label><label>확인일*<input type="date" name="checked_date" required></label><label>확인 방법*<select name="check_method">' + ['방문', '전화', '면담', '자료 수령', '기타'].map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></label>' +
    '<label>확인 상대방(직위)<input name="counterpart"></label><label class="full">확인된 사실* (한 줄에 하나, 의견은 쓰지 않음)<textarea name="facts"></textarea></label><label>영업 상황<input name="business_status"></label><label>결제계획(금액·일자·방법)<input name="payment_plan"></label>' +
    '<label class="full">작성자 의견 (사실과 별도)<textarea name="opinion"></textarea></label><label>확인 결과 분류*<select name="result_class"><option value="">선택</option>' + d.resultClasses.map(function (r) { return '<option>' + h(r) + '</option>'; }).join('') + '</select></label><label>재점검일*<input type="date" name="recheck_date"></label>' +
    '<label class="full">추가 확인사항<input name="further_checks"></label><label>후속 조치<input name="followup"></label><label>후속 기한<input type="date" name="followup_due"></label>' +
    '<div class="full"><button class="primary" type="button" id="mk">파일 만들기</button> <span class="muted" id="mkMsg"></span></div></form></section>';
  document.getElementById('view').innerHTML = html;
  document.getElementById('mk').onclick = makeFile;
}
function pickCase(id) { var s = document.getElementById('caseSel'); if (s) s.value = id; }
function makeFile() {
  var f = document.getElementById('tf'), o = {};
  Array.prototype.forEach.call(f.elements, function (el) { if (el.name) o[el.name] = el.value; });
  o.facts = String(o.facts || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  var msg = document.getElementById('mkMsg');
  if (!o.case_id || !o.checked_date || !o.facts.length || !o.result_class || !o.recheck_date) { msg.textContent = '관리 건·확인일·확인된 사실·결과 분류·재점검일은 필수입니다.'; return; }
  o.submitted_at = new Date().toISOString(); o.snapshot_generated_at = DATA.generated_at;
  var name = 'TREND_' + o.case_id + '_' + o.checked_date.replace(/-/g, '') + '.json';
  var blob = new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = name + ' 파일을 내려받았습니다. 사내 메일로 채권담당에게 보내세요.';
}
render();
</script>
