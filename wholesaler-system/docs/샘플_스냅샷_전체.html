<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중도매인 통합관리 스냅샷</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0f0ec; --border: #dcdbd5;
    --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
    --accent: #2a78d6; --accent-ink: #ffffff;
    --series-1: #2a78d6; --series-2: #eb6834;
    --ok: #0f7b3e; --ok-bg: #e5f4ea; --warn: #8a5a00; --warn-bg: #fff3d6;
    --bad: #b42318; --bad-bg: #fde8e7; --info-bg: #e8eef7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #3a3936;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #94938b;
      --accent: #3987e5; --accent-ink: #ffffff;
      --series-1: #3987e5; --series-2: #d95926;
      --ok: #6fd39a; --ok-bg: #173323; --warn: #f2c25b; --warn-bg: #3a2e12;
      --bad: #ff8f86; --bad-bg: #3d1a18; --info-bg: #1d2a3b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #3a3936;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #94938b;
    --accent: #3987e5; --accent-ink: #ffffff;
    --series-1: #3987e5; --series-2: #d95926;
    --ok: #6fd39a; --ok-bg: #173323; --warn: #f2c25b; --warn-bg: #3a2e12;
    --bad: #ff8f86; --bad-bg: #3d1a18; --info-bg: #1d2a3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; }
  .ver { color: var(--muted); font-weight: 400; font-size: 12px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
  nav a { padding: 4px 10px; border-radius: 6px; color: var(--text-2); }
  nav a.on { background: var(--info-bg); color: var(--text); font-weight: 600; }
  .who { color: var(--text-2); font-size: 13px; }
  .statusbar { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 16px; font-size: 13px;
    background: var(--surface-2); border-bottom: 1px solid var(--border); color: var(--text-2); }
  .statusbar b { color: var(--text); font-weight: 600; }
  main { padding: 16px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  h3 { font-size: 14px; margin: 12px 0 6px; color: var(--text-2); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  @media (min-width: 900px) { .card.span2 { grid-column: span 2; } }
  .tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .tile .k { color: var(--text-2); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 700; }
  .tile .v small { font-size: 13px; font-weight: 400; color: var(--text-2); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; white-space: nowrap; }
  th { color: var(--text-2); font-weight: 600; background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; min-width: 220px; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-info { background: var(--info-bg); color: var(--text); }
  .note { font-size: 12px; color: var(--text-2); background: var(--surface-2); border-left: 3px solid var(--border); padding: 6px 10px; margin: 8px 0; }
  .note.warn { border-left-color: var(--warn); background: var(--warn-bg); color: var(--text); }
  .note.bad { border-left-color: var(--bad); background: var(--bad-bg); color: var(--text); }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; max-width: 100%; }
  textarea { width: 100%; min-height: 54px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  form.f { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; margin: 8px 0; }
  form.f label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--text-2); }
  form.f .full { grid-column: 1 / -1; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  dl.kv dt { color: var(--text-2); }
  dl.kv dd { margin: 0; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
  .tabs button.on { background: var(--info-bg); font-weight: 600; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .axis { fill: var(--text-2); font-size: 11px; }
  .chart .grid line { stroke: var(--border); }
  .chart .s1 { fill: var(--series-1); }
  .chart .s2 { fill: var(--series-2); }
  .chart rect.bar:hover { opacity: .8; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px; border-radius: 8px;
    background: var(--text); color: var(--surface); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: .95; }
  .toast.err { background: var(--bad); color: #fff; }
  @media (max-width: 640px) { main { padding: 12px 16px; } .tile .v { font-size: 18px; } }
</style>

<style>
  .snap-head { font-size: 12px; color: var(--text-2); }
  .form-box { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .hidden { display: none; }
  details > summary { cursor: pointer; font-weight: 600; margin: 6px 0; }
</style>
</head>

function pickCase(id) { var s = document.getElementById('caseSel'); if (s) s.value = id; }
function makeFile() {
  var f = document.getElementById('tf'), o = {};
  Array.prototype.forEach.call(f.elements, function (el) { if (el.name) o[el.name] = el.value; });
  o.facts = String(o.facts || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  var msg = document.getElementById('mkMsg');
  if (!o.case_id || !o.checked_date || !o.facts.length || !o.result_class || !o.recheck_date) { msg.textContent = '관리 건·확인일·확인된 사실·결과 분류·재점검일은 필수입니다.'; return; }
  o.submitted_at = new Date().toISOString(); o.snapshot_generated_at = DATA.generated_at;
  var name = 'TREND_' + o.case_id + '_' + o.checked_date.replace(/-/g, '') + '.json';
  var blob = new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = name + ' 파일을 내려받았습니다. 사내 메일로 채권담당에게 보내세요.';
}
