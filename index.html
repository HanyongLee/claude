<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용의 여의주 찾기</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b2440, #0a0e1a 70%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: #f0e6d2;
  }
  #game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 1px;
    color: #ffd76a;
    text-shadow: 0 0 12px rgba(255, 215, 106, 0.6);
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 1rem;
    background: rgba(255,255,255,0.06);
    padding: 8px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #hud span { color: #ffd76a; font-weight: bold; }
  canvas {
    background: #0d1120;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,215,106,0.35);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5, 7, 15, 0.88);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.6rem; color: #ffd76a; }
  #overlay p { margin: 0; max-width: 360px; line-height: 1.5; color: #d9d0bd; font-size: 0.92rem; }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(180deg, #ffd76a, #e8a93a);
    color: #221703;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #a5711b;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a5711b; }
  #mobile-controls {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 6px;
    margin-top: 4px;
  }
  #mobile-controls button {
    width: 52px;
    height: 52px;
    font-size: 1.3rem;
    padding: 0;
    box-shadow: 0 3px 0 #a5711b;
  }
  .ctrl-up { grid-column: 2; grid-row: 1; }
  .ctrl-left { grid-column: 1; grid-row: 2; }
  .ctrl-down { grid-column: 2; grid-row: 2; }
  .ctrl-right { grid-column: 3; grid-row: 2; }
  #hint {
    font-size: 0.8rem;
    color: #8f97b3;
  }
</style>
</head>
<body>
<div id="game-container">
  <h1>🐉 용의 여의주 찾기 🔮</h1>
  <div id="hud">
    <div>레벨 <span id="level-val">1</span></div>
    <div>생명 <span id="lives-val">3</span></div>
    <div>시간 <span id="time-val">0</span>s</div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="mobile-controls">
    <button class="ctrl-up" data-dir="up">▲</button>
    <button class="ctrl-left" data-dir="left">◀</button>
    <button class="ctrl-down" data-dir="down">▼</button>
    <button class="ctrl-right" data-dir="right">▶</button>
  </div>
  <div id="hint">방향키 또는 WASD로 이동 · 화염 요괴에 닿으면 생명이 줄어듭니다</div>

  <div id="overlay">
    <h2>용의 여의주 찾기</h2>
    <p>
      전설의 용이 잠에서 깨어나, 미로 깊숙한 곳에 숨겨진 여의주를 찾아 떠납니다.
      미로를 탐험하며 떠도는 화염 요괴를 피해 여의주(🔮)까지 도달하세요.
      생명은 3개, 요괴에 닿으면 하나씩 줄어듭니다.
    </p>
    <button id="start-btn">모험 시작</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const levelVal = document.getElementById('level-val');
  const livesVal = document.getElementById('lives-val');
  const timeVal = document.getElementById('time-val');

  const MAX_LEVEL = 5;
  const CELL = 34;
  const BASE_SIZE = 9;

  let level = 1;
  let lives = 3;
  let maze, cols, rows;
  let player, goal, obstacles;
  let elapsed = 0;
  let timerHandle = null;
  let running = false;
  let invuln = false;
  let lastMoveTime = 0;
  const MOVE_COOLDOWN = 120;

  function sizeForLevel(lv) {
    const n = BASE_SIZE + (lv - 1) * 2;
    return n % 2 === 0 ? n + 1 : n;
  }

  function makeGrid(c, r) {
    const grid = [];
    for (let y = 0; y < r; y++) {
      const row = [];
      for (let x = 0; x < c; x++) {
        row.push({ N: true, E: true, S: true, W: true, visited: false });
      }
      grid.push(row);
    }
    return grid;
  }

  const DIRS = [
    { name: 'N', dx: 0, dy: -1, opp: 'S' },
    { name: 'E', dx: 1, dy: 0, opp: 'W' },
    { name: 'S', dx: 0, dy: 1, opp: 'N' },
    { name: 'W', dx: -1, dy: 0, opp: 'E' },
  ];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function carveMaze(c, r) {
    const grid = makeGrid(c, r);
    const stack = [{ x: 0, y: 0 }];
    grid[0][0].visited = true;
    while (stack.length) {
      const cur = stack[stack.length - 1];
      const dirs = shuffle(DIRS.slice());
      let advanced = false;
      for (const d of dirs) {
        const nx = cur.x + d.dx;
        const ny = cur.y + d.dy;
        if (nx >= 0 && nx < c && ny >= 0 && ny < r && !grid[ny][nx].visited) {
          grid[cur.y][cur.x][d.name] = false;
          grid[ny][nx][d.opp] = false;
          grid[ny][nx].visited = true;
          stack.push({ x: nx, y: ny });
          advanced = true;
          break;
        }
      }
      if (!advanced) stack.pop();
    }
    return grid;
  }

  function canMove(x, y, dirName) {
    const d = DIRS.find(dd => dd.name === dirName);
    if (maze[y][x][dirName]) return false;
    const nx = x + d.dx, ny = y + d.dy;
    return nx >= 0 && nx < cols && ny >= 0 && ny < rows;
  }

  function openDirs(x, y) {
    return DIRS.filter(d => canMove(x, y, d.name));
  }

  function setupLevel() {
    const n = sizeForLevel(level);
    cols = n; rows = n;
    maze = carveMaze(cols, rows);
    player = { x: 0, y: 0 };
    goal = { x: cols - 1, y: rows - 1 };

    const obstacleCount = Math.min(2 + level, 7);
    obstacles = [];
    let attempts = 0;
    while (obstacles.length < obstacleCount && attempts < 500) {
      attempts++;
      const ox = Math.floor(Math.random() * cols);
      const oy = Math.floor(Math.random() * rows);
      const distFromStart = Math.abs(ox - player.x) + Math.abs(oy - player.y);
      const distFromGoal = Math.abs(ox - goal.x) + Math.abs(oy - goal.y);
      if (distFromStart < 3 || distFromGoal < 2) continue;
      if (obstacles.some(o => o.x === ox && o.y === oy)) continue;
      const dirs = openDirs(ox, oy);
      if (dirs.length === 0) continue;
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      obstacles.push({ x: ox, y: oy, dir: dir.name, moveEvery: Math.max(260, 500 - level * 30), acc: 0 });
    }

    canvas.width = cols * CELL;
    canvas.height = rows * CELL;
    elapsed = 0;
    invuln = false;
    levelVal.textContent = level;
    livesVal.textContent = lives;
    timeVal.textContent = '0';
  }

  function resetPlayerPosition() {
    player.x = 0;
    player.y = 0;
    invuln = true;
    setTimeout(() => { invuln = false; }, 900);
  }

  function moveObstacle(o) {
    if (canMove(o.x, o.y, o.dir)) {
      const d = DIRS.find(dd => dd.name === o.dir);
      o.x += d.dx;
      o.y += d.dy;
    } else {
      const dirs = openDirs(o.x, o.y);
      const opp = DIRS.find(d => d.name === o.dir).opp;
      const preferred = dirs.filter(d => d.name !== opp);
      const pool = preferred.length ? preferred : dirs;
      if (pool.length) {
        const nd = pool[Math.floor(Math.random() * pool.length)];
        o.dir = nd.name;
        o.x += nd.dx;
        o.y += nd.dy;
      }
    }
  }

  function checkCollision() {
    if (invuln) return;
    for (const o of obstacles) {
      if (o.x === player.x && o.y === player.y) {
        lives--;
        livesVal.textContent = lives;
        if (lives <= 0) {
          endGame(false);
        } else {
          resetPlayerPosition();
        }
        return;
      }
    }
  }

  function checkWin() {
    if (player.x === goal.x && player.y === goal.y) {
      endGame(true);
    }
  }

  function endGame(won) {
    running = false;
    stopTimer();
    if (won) {
      if (level >= MAX_LEVEL) {
        showOverlay(
          '여의주를 찾았습니다! 🎉',
          `용이 마침내 전설의 여의주를 손에 넣었습니다. 모든 ${MAX_LEVEL}단계를 클리어했어요!`,
          '처음부터 다시하기',
          () => { level = 1; lives = 3; startLevel(); }
        );
      } else {
        showOverlay(
          `${level}단계 클리어! ✨`,
          '여의주의 기운이 느껴집니다... 더 깊은 미로가 기다리고 있어요.',
          '다음 단계로',
          () => { level++; startLevel(); }
        );
      }
    } else {
      showOverlay(
        '용이 쓰러졌습니다... 💔',
        '화염 요괴에게 모든 생명을 잃었습니다. 다시 도전해보세요.',
        '다시 도전하기',
        () => { level = 1; lives = 3; startLevel(); }
      );
    }
  }

  function showOverlay(title, text, btnLabel, onClick) {
    overlay.innerHTML = '';
    const h2 = document.createElement('h2');
    h2.textContent = title;
    const p = document.createElement('p');
    p.textContent = text;
    const btn = document.createElement('button');
    btn.textContent = btnLabel;
    btn.onclick = onClick;
    overlay.appendChild(h2);
    overlay.appendChild(p);
    overlay.appendChild(btn);
    overlay.classList.remove('hidden');
  }

  function startLevel() {
    setupLevel();
    overlay.classList.add('hidden');
    running = true;
    startTimer();
  }

  function startTimer() {
    stopTimer();
    timerHandle = setInterval(() => {
      elapsed++;
      timeVal.textContent = elapsed;
    }, 1000);
  }
  function stopTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }

  function tryMovePlayer(dirName) {
    if (!running) return;
    const now = performance.now();
    if (now - lastMoveTime < MOVE_COOLDOWN) return;
    if (canMove(player.x, player.y, dirName)) {
      const d = DIRS.find(dd => dd.name === dirName);
      player.x += d.dx;
      player.y += d.dy;
      lastMoveTime = now;
      checkCollision();
      checkWin();
    }
  }

  const keyMap = {
    ArrowUp: 'N', w: 'N', W: 'N',
    ArrowDown: 'S', s: 'S', S: 'S',
    ArrowLeft: 'W', a: 'W', A: 'W',
    ArrowRight: 'E', d: 'E', D: 'E',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      tryMovePlayer(dir);
    }
  });

  const dirButtonMap = { up: 'N', down: 'S', left: 'W', right: 'E' };
  document.querySelectorAll('#mobile-controls button').forEach(btn => {
    const dir = dirButtonMap[btn.dataset.dir];
    const fire = (e) => { e.preventDefault(); tryMovePlayer(dir); };
    btn.addEventListener('pointerdown', fire);
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    level = 1;
    lives = 3;
    startLevel();
  });

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0d1120';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#4a5a8a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cell = maze[y][x];
        const px = x * CELL, py = y * CELL;
        ctx.beginPath();
        if (cell.N) { ctx.moveTo(px, py); ctx.lineTo(px + CELL, py); }
        if (cell.W) { ctx.moveTo(px, py); ctx.lineTo(px, py + CELL); }
        if (cell.E) { ctx.moveTo(px + CELL, py); ctx.lineTo(px + CELL, py + CELL); }
        if (cell.S) { ctx.moveTo(px, py + CELL); ctx.lineTo(px + CELL, py + CELL); }
        ctx.stroke();
      }
    }

    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
    ctx.save();
    ctx.shadowColor = `rgba(255, 215, 106, ${0.5 + pulse * 0.5})`;
    ctx.shadowBlur = 18;
    ctx.font = `${CELL * 0.7}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔮', goal.x * CELL + CELL / 2, goal.y * CELL + CELL / 2);
    ctx.restore();

    ctx.font = `${CELL * 0.75}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const o of obstacles) {
      ctx.fillText('🔥', o.x * CELL + CELL / 2, o.y * CELL + CELL / 2);
    }

    ctx.save();
    if (invuln && Math.floor(performance.now() / 120) % 2 === 0) {
      ctx.globalAlpha = 0.35;
    }
    ctx.fillText('🐉', player.x * CELL + CELL / 2, player.y * CELL + CELL / 2);
    ctx.restore();
  }

  let lastFrame = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!running) return;
    if (!lastFrame) lastFrame = ts;
    const dt = ts - lastFrame;
    lastFrame = ts;

    for (const o of obstacles) {
      o.acc += dt;
      if (o.acc >= o.moveEvery) {
        o.acc = 0;
        moveObstacle(o);
      }
    }
    checkCollision();
    draw();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
