<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용의 여의주 찾기</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b2440, #0a0e1a 70%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: #f0e6d2;
  }
  #game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 1.4rem;
    letter-spacing: 1px;
    color: #ffd76a;
    text-shadow: 0 0 12px rgba(255, 215, 106, 0.6);
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 1rem;
    background: rgba(255,255,255,0.06);
    padding: 8px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #hud span { color: #ffd76a; font-weight: bold; }
  #effect-status {
    display: none;
    gap: 14px;
    font-size: 0.85rem;
    background: rgba(255, 215, 106, 0.08);
    padding: 6px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 215, 106, 0.3);
    color: #ffe9b0;
  }
  #effect-status.show { display: flex; }
  canvas {
    background: #0d1120;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6), inset 0 0 0 2px rgba(255,215,106,0.35);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(5, 7, 15, 0.88);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.6rem; color: #ffd76a; }
  #overlay p { margin: 0; max-width: 360px; line-height: 1.5; color: #d9d0bd; font-size: 0.92rem; }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(180deg, #ffd76a, #e8a93a);
    color: #221703;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #a5711b;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a5711b; }
  #mobile-controls {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(2, 52px);
    gap: 6px;
    margin-top: 4px;
  }
  #mobile-controls button {
    width: 52px;
    height: 52px;
    font-size: 1.3rem;
    padding: 0;
    box-shadow: 0 3px 0 #a5711b;
  }
  .ctrl-up { grid-column: 2; grid-row: 1; }
  .ctrl-left { grid-column: 1; grid-row: 2; }
  .ctrl-down { grid-column: 2; grid-row: 2; }
  .ctrl-right { grid-column: 3; grid-row: 2; }
  #hint {
    font-size: 0.8rem;
    color: #8f97b3;
  }
</style>
</head>
<body>
<div id="game-container">
  <h1>🐉 용의 여의주 찾기 🔮</h1>
  <div id="hud">
    <div>레벨 <span id="level-val">1</span></div>
    <div>생명 <span id="lives-val">3</span></div>
    <div>시간 <span id="time-val">0</span>s</div>
  </div>
  <div id="effect-status"></div>
  <canvas id="canvas"></canvas>
  <div id="mobile-controls">
    <button class="ctrl-up" data-dir="up">▲</button>
    <button class="ctrl-left" data-dir="left">◀</button>
    <button class="ctrl-down" data-dir="down">▼</button>
    <button class="ctrl-right" data-dir="right">▶</button>
  </div>
  <div id="hint">방향키 또는 WASD로 이동 · 병사에 닿으면 생명 감소 · 선물 상자(🎁)를 먹으면 랜덤 효과 발동!</div>

  <div id="overlay">
    <h2>용의 여의주 찾기</h2>
    <p>
      전설의 용이 잠에서 깨어나, 미로 깊숙한 곳에 숨겨진 여의주를 찾아 떠납니다.
      미로를 탐험하며 순찰하는 드래곤슬레이어 병사를 피해 여의주(🔮)까지 도달하세요.
      생명은 3개, 병사에 닿으면 하나씩 줄어듭니다.
      곳곳의 선물 상자(🎁)를 먹으면 무적·가속·적 둔화 중 하나가 랜덤으로 발동돼요.
    </p>
    <button id="start-btn">모험 시작</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const levelVal = document.getElementById('level-val');
  const livesVal = document.getElementById('lives-val');
  const timeVal = document.getElementById('time-val');
  const effectStatusEl = document.getElementById('effect-status');

  const MAX_LEVEL = 5;
  const CELL = 34;
  const BASE_SIZE = 9;

  let level = 1;
  let lives = 3;
  let maze, cols, rows;
  let player, goal, obstacles;
  let elapsed = 0;
  let timerHandle = null;
  let running = false;
  let invuln = false;
  let lastMoveTime = 0;
  let facing = 1;
  const MOVE_COOLDOWN = 120;
  const EFFECT_DURATION = 7000;
  let items = [];
  let invincibleUntil = 0;
  let speedUntil = 0;
  let freezeUntil = 0;
  const EFFECT_INFO = {
    invincible: { label: '무적', icon: '✨' },
    speed: { label: '가속', icon: '⚡' },
    freeze: { label: '적 둔화', icon: '❄️' },
  };

  const DRAGON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3c9a6e"/>
        <stop offset="100%" stop-color="#0f2b1f"/>
      </linearGradient>
    </defs>
    <path d="M 100 78 C 88 55, 72 35, 50 22 C 68 26, 84 24, 96 16 C 96 30, 100 40, 108 48 C 116 34, 128 24, 144 20 C 136 34, 132 46, 132 58 C 122 62, 112 70, 104 84 Z" fill="url(#g1)" stroke="#0a1a12" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 10 108 C 22 96, 38 100, 46 112 C 50 100, 62 92, 76 90 C 84 78, 96 70, 108 66 C 120 58, 136 48, 152 42 C 162 38, 174 38, 184 44 C 176 44, 168 48, 164 54 C 172 54, 180 52, 186 46 C 184 56, 174 62, 164 64 C 168 70, 166 76, 160 80 C 156 72, 148 68, 140 70 C 128 76, 116 86, 106 98 C 96 110, 90 122, 90 134 C 80 128, 74 118, 76 108 C 64 114, 54 122, 48 132 C 44 122, 46 112, 52 104 C 40 106, 28 112, 20 122 C 14 118, 10 112, 10 108 Z" fill="url(#g1)" stroke="#0a1a12" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 150 44 L 156 32 L 154 45 Z M 136 52 L 142 41 L 140 53 Z M 121 61 L 127 50 L 125 62 Z M 106 70 L 112 60 L 110 71 Z" fill="#f0d98a" stroke="#0a1a12" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 168 44 L 176 28 L 172 46 Z" fill="#f0d98a" stroke="#0a1a12" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="176" cy="50" r="4" fill="#ffe28a"/>
    <path d="M 96 16 L 100 76 M 108 48 L 105 80" stroke="#0a1a12" stroke-width="1.6" fill="none" opacity="0.55" stroke-linecap="round"/>
  </svg>`;
  let dragonReady = false;
  const dragonImg = new Image();
  dragonImg.onload = () => { dragonReady = true; };
  dragonImg.src = 'data:image/svg+xml,' + encodeURIComponent(DRAGON_SVG);

  const SOLDIER_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200">
    <defs>
      <linearGradient id="armor" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9aa7b5"/>
        <stop offset="100%" stop-color="#454e58"/>
      </linearGradient>
      <linearGradient id="cape" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c94a3a"/>
        <stop offset="100%" stop-color="#6e1f16"/>
      </linearGradient>
    </defs>
    <path d="M 78 60 C 60 70, 48 90, 46 120 C 45 145, 50 168, 60 185 C 62 165, 66 150, 74 138 C 68 150, 66 165, 70 180 C 78 165, 80 145, 78 120 C 92 140, 96 165, 92 186 C 100 168, 104 145, 100 118 C 102 95, 96 74, 84 60 Z" fill="url(#cape)" stroke="#3a0f0a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 82 128 L 78 158 L 70 178 L 84 180 L 92 158 L 94 130 Z" fill="url(#armor)" stroke="#20242a" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="66" y="178" width="22" height="10" rx="3" fill="#2b2f36" stroke="#0e1013" stroke-width="1.5"/>
    <path d="M 66 130 L 58 158 L 50 178 L 64 182 L 74 160 L 78 132 Z" fill="url(#armor)" stroke="#20242a" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="46" y="180" width="22" height="10" rx="3" fill="#2b2f36" stroke="#0e1013" stroke-width="1.5"/>
    <path d="M 54 66 C 52 84, 52 104, 58 128 L 92 128 C 98 104, 98 84, 96 66 C 90 74, 82 78, 75 78 C 68 78, 60 74, 54 66 Z" fill="url(#armor)" stroke="#20242a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 75 90 L 80 100 L 75 112 L 70 100 Z" fill="#f0d98a" stroke="#8a6a2a" stroke-width="1"/>
    <circle cx="94" cy="70" r="12" fill="url(#armor)" stroke="#20242a" stroke-width="2.5"/>
    <path d="M 98 78 L 104 100 L 100 118 L 90 116 L 92 96 Z" fill="url(#armor)" stroke="#20242a" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="108" cy="104" rx="12" ry="16" fill="#5a6470" stroke="#20242a" stroke-width="2.5"/>
    <path d="M 108 92 L 108 116 M 100 104 L 116 104" stroke="#f0d98a" stroke-width="2" opacity="0.8"/>
    <circle cx="56" cy="70" r="12" fill="url(#armor)" stroke="#20242a" stroke-width="2.5"/>
    <path d="M 52 76 L 38 56 L 30 40 L 38 34 L 48 50 L 58 72 Z" fill="url(#armor)" stroke="#20242a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 30 10 L 36 6 L 40 34 L 33 40 Z" fill="#d8dee5" stroke="#20242a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="26" y="32" width="16" height="6" rx="2" fill="#f0d98a" stroke="#8a6a2a" stroke-width="1.5"/>
    <rect x="31" y="36" width="6" height="16" rx="2" fill="#5a3a1a" stroke="#20242a" stroke-width="1.5"/>
    <rect x="68" y="56" width="14" height="12" fill="url(#armor)" stroke="#20242a" stroke-width="2"/>
    <path d="M 58 56 C 56 40, 64 26, 76 24 C 90 24, 98 38, 96 54 C 96 60, 90 64, 82 65 L 82 58 L 70 58 L 70 65 C 64 64, 58 62, 58 56 Z" fill="url(#armor)" stroke="#20242a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 68 44 L 88 44" stroke="#0e1013" stroke-width="3" stroke-linecap="round"/>
    <path d="M 76 24 C 74 14, 76 4, 80 0 C 84 4, 86 14, 82 24 Z" fill="url(#cape)" stroke="#3a0f0a" stroke-width="1.6"/>
    <path d="M 58 40 L 48 32 L 56 44 Z M 96 40 L 106 32 L 98 44 Z" fill="#f0d98a" stroke="#8a6a2a" stroke-width="1"/>
  </svg>`;
  let soldierReady = false;
  const soldierImg = new Image();
  soldierImg.onload = () => { soldierReady = true; };
  soldierImg.src = 'data:image/svg+xml,' + encodeURIComponent(SOLDIER_SVG);

  function sizeForLevel(lv) {
    const n = BASE_SIZE + (lv - 1) * 2;
    return n % 2 === 0 ? n + 1 : n;
  }

  function makeGrid(c, r) {
    const grid = [];
    for (let y = 0; y < r; y++) {
      const row = [];
      for (let x = 0; x < c; x++) {
        row.push({ N: true, E: true, S: true, W: true, visited: false });
      }
      grid.push(row);
    }
    return grid;
  }

  const DIRS = [
    { name: 'N', dx: 0, dy: -1, opp: 'S' },
    { name: 'E', dx: 1, dy: 0, opp: 'W' },
    { name: 'S', dx: 0, dy: 1, opp: 'N' },
    { name: 'W', dx: -1, dy: 0, opp: 'E' },
  ];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function carveMaze(c, r) {
    const grid = makeGrid(c, r);
    const stack = [{ x: 0, y: 0 }];
    grid[0][0].visited = true;
    while (stack.length) {
      const cur = stack[stack.length - 1];
      const dirs = shuffle(DIRS.slice());
      let advanced = false;
      for (const d of dirs) {
        const nx = cur.x + d.dx;
        const ny = cur.y + d.dy;
        if (nx >= 0 && nx < c && ny >= 0 && ny < r && !grid[ny][nx].visited) {
          grid[cur.y][cur.x][d.name] = false;
          grid[ny][nx][d.opp] = false;
          grid[ny][nx].visited = true;
          stack.push({ x: nx, y: ny });
          advanced = true;
          break;
        }
      }
      if (!advanced) stack.pop();
    }
    return grid;
  }

  function canMove(x, y, dirName) {
    const d = DIRS.find(dd => dd.name === dirName);
    if (maze[y][x][dirName]) return false;
    const nx = x + d.dx, ny = y + d.dy;
    return nx >= 0 && nx < cols && ny >= 0 && ny < rows;
  }

  function openDirs(x, y) {
    return DIRS.filter(d => canMove(x, y, d.name));
  }

  function setupLevel() {
    const n = sizeForLevel(level);
    cols = n; rows = n;
    maze = carveMaze(cols, rows);
    player = { x: 0, y: 0 };
    goal = { x: cols - 1, y: rows - 1 };

    const obstacleCount = Math.min(2 + level, 7);
    obstacles = [];
    let attempts = 0;
    while (obstacles.length < obstacleCount && attempts < 500) {
      attempts++;
      const ox = Math.floor(Math.random() * cols);
      const oy = Math.floor(Math.random() * rows);
      const distFromStart = Math.abs(ox - player.x) + Math.abs(oy - player.y);
      const distFromGoal = Math.abs(ox - goal.x) + Math.abs(oy - goal.y);
      if (distFromStart < 3 || distFromGoal < 2) continue;
      if (obstacles.some(o => o.x === ox && o.y === oy)) continue;
      const dirs = openDirs(ox, oy);
      if (dirs.length === 0) continue;
      const dir = dirs[Math.floor(Math.random() * dirs.length)];
      obstacles.push({ x: ox, y: oy, dir: dir.name, facing: dir.name === 'W' ? -1 : 1, moveEvery: Math.max(260, 500 - level * 30), acc: 0 });
    }

    const itemCount = Math.min(2 + Math.floor(level / 2), 5);
    items = [];
    attempts = 0;
    while (items.length < itemCount && attempts < 500) {
      attempts++;
      const ix = Math.floor(Math.random() * cols);
      const iy = Math.floor(Math.random() * rows);
      const distFromStart = Math.abs(ix - player.x) + Math.abs(iy - player.y);
      const distFromGoal = Math.abs(ix - goal.x) + Math.abs(iy - goal.y);
      if (distFromStart < 2 || distFromGoal < 1) continue;
      if (items.some(it => it.x === ix && it.y === iy)) continue;
      if (obstacles.some(o => o.x === ix && o.y === iy)) continue;
      items.push({ x: ix, y: iy });
    }

    canvas.width = cols * CELL;
    canvas.height = rows * CELL;
    elapsed = 0;
    invuln = false;
    invincibleUntil = 0;
    speedUntil = 0;
    freezeUntil = 0;
    levelVal.textContent = level;
    livesVal.textContent = lives;
    timeVal.textContent = '0';
  }

  function resetPlayerPosition() {
    player.x = 0;
    player.y = 0;
    invuln = true;
    setTimeout(() => { invuln = false; }, 900);
  }

  function moveObstacle(o) {
    if (canMove(o.x, o.y, o.dir)) {
      const d = DIRS.find(dd => dd.name === o.dir);
      o.x += d.dx;
      o.y += d.dy;
    } else {
      const dirs = openDirs(o.x, o.y);
      const opp = DIRS.find(d => d.name === o.dir).opp;
      const preferred = dirs.filter(d => d.name !== opp);
      const pool = preferred.length ? preferred : dirs;
      if (pool.length) {
        const nd = pool[Math.floor(Math.random() * pool.length)];
        o.dir = nd.name;
        o.x += nd.dx;
        o.y += nd.dy;
      }
    }
    if (o.dir === 'W') o.facing = -1;
    else if (o.dir === 'E') o.facing = 1;
  }

  function collectItem() {
    const idx = items.findIndex(it => it.x === player.x && it.y === player.y);
    if (idx === -1) return;
    items.splice(idx, 1);
    const effects = Object.keys(EFFECT_INFO);
    const effect = effects[Math.floor(Math.random() * effects.length)];
    const until = performance.now() + EFFECT_DURATION;
    if (effect === 'invincible') invincibleUntil = until;
    else if (effect === 'speed') speedUntil = until;
    else if (effect === 'freeze') freezeUntil = until;
  }

  function updateEffectHUD() {
    const now = performance.now();
    const parts = [];
    if (invincibleUntil > now) parts.push(`${EFFECT_INFO.invincible.icon} ${EFFECT_INFO.invincible.label} ${Math.ceil((invincibleUntil - now) / 1000)}s`);
    if (speedUntil > now) parts.push(`${EFFECT_INFO.speed.icon} ${EFFECT_INFO.speed.label} ${Math.ceil((speedUntil - now) / 1000)}s`);
    if (freezeUntil > now) parts.push(`${EFFECT_INFO.freeze.icon} ${EFFECT_INFO.freeze.label} ${Math.ceil((freezeUntil - now) / 1000)}s`);
    effectStatusEl.textContent = parts.join('   ');
    effectStatusEl.classList.toggle('show', parts.length > 0);
  }

  function checkCollision() {
    if (invuln) return;
    if (performance.now() < invincibleUntil) return;
    for (const o of obstacles) {
      if (o.x === player.x && o.y === player.y) {
        lives--;
        livesVal.textContent = lives;
        if (lives <= 0) {
          endGame(false);
        } else {
          resetPlayerPosition();
        }
        return;
      }
    }
  }

  function checkWin() {
    if (player.x === goal.x && player.y === goal.y) {
      endGame(true);
    }
  }

  function endGame(won) {
    running = false;
    stopTimer();
    if (won) {
      if (level >= MAX_LEVEL) {
        showOverlay(
          '여의주를 찾았습니다! 🎉',
          `용이 마침내 전설의 여의주를 손에 넣었습니다. 모든 ${MAX_LEVEL}단계를 클리어했어요!`,
          '처음부터 다시하기',
          () => { level = 1; lives = 3; startLevel(); }
        );
      } else {
        showOverlay(
          `${level}단계 클리어! ✨`,
          '여의주의 기운이 느껴집니다... 더 깊은 미로가 기다리고 있어요.',
          '다음 단계로',
          () => { level++; startLevel(); }
        );
      }
    } else {
      showOverlay(
        '용이 쓰러졌습니다... 💔',
        '드래곤슬레이어 병사에게 모든 생명을 잃었습니다. 다시 도전해보세요.',
        '다시 도전하기',
        () => { level = 1; lives = 3; startLevel(); }
      );
    }
  }

  function showOverlay(title, text, btnLabel, onClick) {
    overlay.innerHTML = '';
    const h2 = document.createElement('h2');
    h2.textContent = title;
    const p = document.createElement('p');
    p.textContent = text;
    const btn = document.createElement('button');
    btn.textContent = btnLabel;
    btn.onclick = onClick;
    overlay.appendChild(h2);
    overlay.appendChild(p);
    overlay.appendChild(btn);
    overlay.classList.remove('hidden');
  }

  function startLevel() {
    setupLevel();
    overlay.classList.add('hidden');
    running = true;
    startTimer();
  }

  function startTimer() {
    stopTimer();
    timerHandle = setInterval(() => {
      elapsed++;
      timeVal.textContent = elapsed;
    }, 1000);
  }
  function stopTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }

  function tryMovePlayer(dirName) {
    if (!running) return;
    const now = performance.now();
    const cooldown = now < speedUntil ? MOVE_COOLDOWN / 2 : MOVE_COOLDOWN;
    if (now - lastMoveTime < cooldown) return;
    if (canMove(player.x, player.y, dirName)) {
      const d = DIRS.find(dd => dd.name === dirName);
      player.x += d.dx;
      player.y += d.dy;
      if (dirName === 'W') facing = -1;
      else if (dirName === 'E') facing = 1;
      lastMoveTime = now;
      collectItem();
      checkCollision();
      checkWin();
    }
  }

  const keyMap = {
    ArrowUp: 'N', w: 'N', W: 'N',
    ArrowDown: 'S', s: 'S', S: 'S',
    ArrowLeft: 'W', a: 'W', A: 'W',
    ArrowRight: 'E', d: 'E', D: 'E',
  };
  window.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      tryMovePlayer(dir);
    }
  });

  const dirButtonMap = { up: 'N', down: 'S', left: 'W', right: 'E' };
  document.querySelectorAll('#mobile-controls button').forEach(btn => {
    const dir = dirButtonMap[btn.dataset.dir];
    const fire = (e) => { e.preventDefault(); tryMovePlayer(dir); };
    btn.addEventListener('pointerdown', fire);
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    level = 1;
    lives = 3;
    startLevel();
  });

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0d1120';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#4a5a8a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cell = maze[y][x];
        const px = x * CELL, py = y * CELL;
        ctx.beginPath();
        if (cell.N) { ctx.moveTo(px, py); ctx.lineTo(px + CELL, py); }
        if (cell.W) { ctx.moveTo(px, py); ctx.lineTo(px, py + CELL); }
        if (cell.E) { ctx.moveTo(px + CELL, py); ctx.lineTo(px + CELL, py + CELL); }
        if (cell.S) { ctx.moveTo(px, py + CELL); ctx.lineTo(px + CELL, py + CELL); }
        ctx.stroke();
      }
    }

    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
    ctx.save();
    ctx.shadowColor = `rgba(255, 215, 106, ${0.5 + pulse * 0.5})`;
    ctx.shadowBlur = 18;
    ctx.font = `${CELL * 0.7}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔮', goal.x * CELL + CELL / 2, goal.y * CELL + CELL / 2);
    ctx.restore();

    ctx.save();
    ctx.font = `${CELL * 0.6}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const it of items) {
      ctx.fillText('🎁', it.x * CELL + CELL / 2, it.y * CELL + CELL / 2);
    }
    ctx.restore();

    for (const o of obstacles) {
      const ox2 = o.x * CELL + CELL / 2;
      const oy2 = o.y * CELL + CELL / 2;
      if (soldierReady) {
        const w = CELL * 0.95;
        const h = w * (200 / 160);
        ctx.save();
        ctx.translate(ox2, oy2);
        ctx.scale(o.facing, 1);
        ctx.drawImage(soldierImg, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        ctx.font = `${CELL * 0.75}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚔️', ox2, oy2);
      }
    }

    const now2 = performance.now();
    const px2 = player.x * CELL + CELL / 2;
    const py2 = player.y * CELL + CELL / 2;
    if (now2 < invincibleUntil || now2 < speedUntil) {
      ctx.save();
      const auraPulse = 0.5 + 0.5 * Math.sin(now2 / 150);
      ctx.strokeStyle = now2 < invincibleUntil ? `rgba(255, 215, 106, ${0.4 + auraPulse * 0.5})` : `rgba(110, 200, 255, ${0.4 + auraPulse * 0.5})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px2, py2, CELL * 0.62, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    if (invuln && Math.floor(performance.now() / 120) % 2 === 0) {
      ctx.globalAlpha = 0.35;
    }
    if (dragonReady) {
      const w = CELL * 1.15;
      const h = w * (160 / 200);
      ctx.translate(px2, py2);
      ctx.scale(facing, 1);
      ctx.drawImage(dragonImg, -w / 2, -h / 2, w, h);
    } else {
      ctx.font = `${CELL * 0.75}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐉', px2, py2);
    }
    ctx.restore();
  }

  let lastFrame = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!running) return;
    if (!lastFrame) lastFrame = ts;
    const dt = ts - lastFrame;
    lastFrame = ts;

    if (ts >= freezeUntil) {
      for (const o of obstacles) {
        o.acc += dt;
        if (o.acc >= o.moveEvery) {
          o.acc = 0;
          moveObstacle(o);
        }
      }
    }
    checkCollision();
    updateEffectHUD();
    draw();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
